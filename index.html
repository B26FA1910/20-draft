<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draftly</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-0.88 -1.62 65.75 65.75%22%3E%3Crect x=%229%22 y=%2212%22 width=%2228%22 height=%2240%22 rx=%226%22 fill=%22%23F0A93E%22 transform=%22rotate%28-16 23 52%29%22/%3E%3Crect x=%2227%22 y=%2212%22 width=%2228%22 height=%2240%22 rx=%226%22 fill=%22%235A93F2%22 transform=%22rotate%2816 41 52%29%22/%3E%3Crect x=%2218%22 y=%228%22 width=%2228%22 height=%2242%22 rx=%226%22 fill=%22%23EDF1F8%22/%3E%3Cpath d=%22M38.5 21.5C37 19.3 34.8 18.2 32 18.2c-3.9 0-6.5 2-6.5 5 0 7.2 13.5 4 13.5 11.4 0 3.2-2.8 5.3-7 5.3-3.2 0-5.8-1.3-7.3-3.8M32 14v30%22 fill=%22none%22 stroke=%22%230E121B%22 stroke-width=%224.2%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Concept: a CS2 case opening. Every player is an "item" with a rarity colour taken from his HLTV rating,
     and each new card is revealed by a short case-opening reel. Everything around the card stays quiet. */
  --bg:#0E121B; --panel:#151B27; --raise:#1D2534; --line:#28324A;
  --ink:#EDF1F8; --muted:#8B97AD;
  --t:#F0A93E; --ct:#5A93F2;
  --money:#3FD38F; --loss:#FF5F6D;
  --r-ind:#5E98D9; --r-mil:#4B69FF; --r-res:#8847FF; --r-cla:#D32CE6; --r-cov:#EB4B4B; --r-gold:#E4AE39;
  /* Golos Text covers Mongolian Cyrillic (Ө, Ү) properly, so all Mongolian text uses it.
     Unbounded is only used for Latin nicknames, the brand and numbers. */
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
.r-ind{--rc:var(--r-ind)} .r-mil{--rc:var(--r-mil)} .r-res{--rc:var(--r-res)} .r-cla{--rc:var(--r-cla)} .r-cov{--rc:var(--r-cov)} .r-gold{--rc:var(--r-gold)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{position:relative;z-index:1}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}
.wrap.enter{animation:enter .4s var(--out)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;line-height:1.12;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ta{color:var(--t)} .tb{color:var(--ct)}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.fine{font-size:12.5px;color:var(--muted);text-align:center;max-width:46ch;margin:0 auto}

/* whose turn: a soft glow from that player's corner */
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aura i{position:absolute;left:-20%;right:-20%;top:-10%;height:75vh;opacity:0;transition:opacity .7s ease}
.aura .a{background:radial-gradient(55% 50% at 18% 0%,rgba(240,169,62,.2),transparent 70%)}
.aura .b{background:radial-gradient(55% 50% at 82% 0%,rgba(90,147,242,.22),transparent 70%)}
.aura .n{background:radial-gradient(70% 55% at 50% 0%,rgba(136,71,255,.16),transparent 70%)}
body[data-side="0"] .aura .a,body[data-side="1"] .aura .b,body[data-side="n"] .aura .n{opacity:1}

/* buttons */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:10px 14px;border-radius:14px;font-weight:700;font-size:16px;line-height:1.15;text-align:center;background:var(--t);color:#2a1700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -10px rgba(240,169,62,.8);transition:transform .14s var(--out),filter .14s,box-shadow .2s}
.btn.blue{background:var(--ct);color:#03162f;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -10px rgba(90,147,242,.9)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:scale(.95)}
.btn:disabled{background:var(--raise);color:var(--muted);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.03);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.07)}
.btn small{font-weight:500;font-size:12px;opacity:.75}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.icon:hover{background:rgba(255,255,255,.09)}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:center;padding:8px}
.linkbtn:hover{color:var(--ink)}

/* avatar: neutral silhouette tinted by rarity */
.ava{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:end center;background:color-mix(in srgb,var(--rc,#8b97ad) 22%,#141a26);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc,#8b97ad) 70%,transparent)}
.ava svg{width:84%;height:84%;fill:color-mix(in srgb,var(--rc,#8b97ad) 45%,#d9e0ec)}
.ava.lg{width:72px;height:72px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 80%,transparent),0 0 0 6px color-mix(in srgb,var(--rc) 14%,transparent)}
.ava.sm{width:30px;height:30px}
.seats .gap{margin-left:7px}
.skipv{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;margin-top:12px}
.skipb{font:600 13px/1 var(--body);color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:99px;padding:9px 14px;cursor:pointer;transition:.2s var(--out)}
.skipb:hover{color:var(--ink);border-color:var(--muted)}
.skipb.ask{color:var(--ink);border-style:solid;border-color:var(--ink)}
.skipb.on{color:var(--ink);border-style:solid;border-color:var(--money);background:color-mix(in srgb,var(--money) 14%,transparent)}
.skipb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.vnote{font-size:13px;color:var(--muted)}.vnote.ask{color:var(--ink)}
.ava.bev{place-items:center}.ava.bev svg{width:104%;height:104%}

/* mini item tile (home fan + reel) */
.mini{position:relative;flex:none;width:104px;height:140px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:10px 8px 14px;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 72%),linear-gradient(#1a2130,#121722);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 45%,transparent)}
.mini::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc)}
.mini .avw{margin-bottom:auto;margin-top:6px}
.mini .ava{width:46px;height:46px}
.mini b{font:700 11.5px/1.15 var(--num);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r{font:800 16px/1 var(--num);color:var(--rc)}
.mini.hitc{box-shadow:inset 0 0 0 2px var(--rc),0 0 24px color-mix(in srgb,var(--rc) 60%,transparent)}

/* home */
.hero{padding:10px 0 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.fan{position:relative;height:196px;width:100%}
.fan .mini{position:absolute;left:50%;top:14px;margin-left:-60px;width:120px;height:162px;transform:translate(var(--x),var(--y)) rotate(var(--rot));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 50%,transparent),0 18px 34px -14px rgba(0,0,0,.8);animation:fan 1s var(--out) both}
.fan .mini .ava{width:56px;height:56px}
.fan .mini:nth-child(1){--x:-100px;--y:14px;--rot:-11deg;animation-delay:.18s}
.fan .mini:nth-child(2){--x:0px;--y:0px;--rot:0deg;z-index:2;animation-delay:.05s}
.fan .mini:nth-child(3){--x:100px;--y:14px;--rot:11deg;animation-delay:.28s}
@keyframes fan{from{transform:translate(0,40px) rotate(0) scale(.86);opacity:0}}
.hero h1{font:800 clamp(38px,12vw,66px)/1 var(--num);letter-spacing:-.03em}
.lede{color:#b8c2d4;max-width:34ch;font-size:15.5px}
.rec{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.recn{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.recn b{display:block;font:700 22px/1 var(--num);margin-bottom:3px;text-align:right}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,transform .15s var(--out),background .2s}
.mode:hover{background:var(--raise);box-shadow:inset 0 0 0 1px #3a4766}
.mode:active{transform:scale(.98)}
.mode b{font:700 17px/1.2 var(--display);display:block}
.mode small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--raise)}
.mi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode:nth-child(1) .mi{color:var(--r-cov)} .mode:nth-child(2) .mi{color:var(--t)} .mode:nth-child(3) .mi{color:var(--ct)}

/* forms */
.top{display:flex;align-items:center;gap:12px}
.top h2{font-size:19px;flex:1}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:13px 14px;font-size:16px;width:100%;transition:box-shadow .15s}
.field input:focus{box-shadow:inset 0 0 0 2px var(--t);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 4px;border-radius:9px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--t)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--num);font-size:24px!important;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.notice{box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:14px}

/* draft: top bar + timer */
.dbar{display:flex;align-items:center;gap:12px}
.cardno{flex:1;font-size:13px;color:var(--muted);line-height:1.2}
.cardno b{display:block;font:800 18px/1.1 var(--display);color:var(--ink)}
.timer{--p:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--t) calc(var(--p)*360deg),var(--raise) 0);flex:none;transition:transform .2s}
.timer.b{background:conic-gradient(var(--ct) calc(var(--p)*360deg),var(--raise) 0)}
.timer span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 16px/1 var(--num);font-variant-numeric:tabular-nums}
.timer.low{background:conic-gradient(var(--loss) calc(var(--p)*360deg),var(--raise) 0);animation:throb 1s ease-in-out infinite}
.timer.low span{color:var(--loss)}
.timer.idle{opacity:.3}
@keyframes throb{50%{transform:scale(1.08)}}

/* wallets */
.mgrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgr{position:relative;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .35s}
.mgr.on{box-shadow:inset 0 0 0 1.5px var(--t),0 12px 30px -16px var(--t)}
.mgr.b.on{box-shadow:inset 0 0 0 1.5px var(--ct),0 12px 30px -16px var(--ct)}
.mgr.hit{animation:hit .7s var(--out)}
@keyframes hit{25%{transform:scale(1.035)}}
.mgr .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mgr .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:6px}
.mgr .nm::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--t);opacity:.35}
.mgr.b .nm::before{background:var(--ct)}
.mgr.on .nm::before{opacity:1;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.mgr .cash{font:700 22px/1 var(--num);color:var(--money)}
.mgr .cash.zero{color:var(--loss)}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seats span{height:7px;border-radius:99px;background:rgba(255,255,255,.08)}
.seats span.f{background:var(--t)}
.mgr.b .seats span.f{background:var(--ct)}
.seats span.pop{animation:pop .6s var(--out)}
@keyframes pop{0%{transform:scale(.3,.3);filter:brightness(2)}55%{transform:scale(1.15,1.9)}}
.mgr .who{font-size:12.5px;line-height:1.35;min-height:17px;overflow-wrap:anywhere;color:#c5cede}
.mgr .meta{font-size:12px;color:var(--muted)}
.mgr .meta b{color:var(--ink);font-weight:600}

/* the card + case reel */
.block{position:relative;z-index:3;display:flex;flex-direction:column;gap:12px}
.block .block{z-index:auto}
.stage{position:relative;perspective:900px}
.pcard{position:relative;border-radius:22px;padding:16px 16px 20px;min-height:208px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;overflow:hidden;isolation:isolate;
  background:radial-gradient(85% 70% at 50% 0%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 72%),linear-gradient(180deg,#1a2131,#121722);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 50%,transparent),0 22px 44px -24px color-mix(in srgb,var(--rc) 75%,transparent)}
.pcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rc)}
.pcard::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.18) 50%,transparent 62%);transform:translateX(-130%)}
.pcard.land{animation:land .55s var(--out)}
.pcard.land::before{animation:sheen 1s .12s ease-out}
@keyframes land{from{transform:scale(.88) rotateX(14deg);opacity:0}}
@keyframes sheen{to{transform:translateX(130%)}}
.pc-rating{position:absolute;left:16px;top:14px;text-align:left;line-height:1}
.pc-rating b{display:block;font:800 30px/1 var(--num);color:var(--rc);letter-spacing:-.02em}
.pc-rating small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}
.pc-role{position:absolute;right:14px;top:14px}
.pc-nick{font:700 clamp(22px,7.4vw,32px)/1.08 var(--num);overflow-wrap:anywhere;max-width:100%;margin-top:4px}
.pc-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--raise);color:var(--ink)}
.chip.role-AWP,.chip.role-AWPIGL{background:rgba(228,174,57,.16);color:#f3c96b}
.chip.role-IGL{background:rgba(63,211,143,.14);color:var(--money)}
.chip.role-Entry{background:rgba(255,95,109,.15);color:#ff8b95}
.chip.mn{background:#c4272f;color:#fff}
.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:2px}
.hint{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted)}
.hint.good{background:rgba(63,211,143,.12);color:var(--money)}
.hint.bad{background:rgba(255,95,109,.12);color:var(--loss)}
.reel{position:absolute;inset:0;z-index:3;border-radius:22px;overflow:hidden;background:#0a0e16;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.stage.reeling .reel{opacity:1}
.stage.reeling .pcard{visibility:hidden}
.track{display:flex;gap:8px;padding-left:8px;will-change:transform}
.reel .marker{position:absolute;left:50%;top:10px;bottom:10px;width:2px;margin-left:-1px;background:var(--r-gold);box-shadow:0 0 14px var(--r-gold);z-index:2;border-radius:2px}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:56px;z-index:1;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#0a0e16,transparent)}
.reel::after{right:0;background:linear-gradient(-90deg,#0a0e16,transparent)}
.stamp{position:absolute;left:50%;top:40%;z-index:3;transform:translate(-50%,-50%) rotate(-9deg);font:900 26px/1 var(--display);padding:10px 18px;border-radius:14px;border:3px solid currentColor;background:rgba(10,14,22,.82);white-space:nowrap;animation:stamp .4s var(--out) both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-9deg) scale(2);opacity:0}}
.pcard.fly0{animation:fly0 .8s cubic-bezier(.5,0,.75,0) .5s both}
.pcard.fly1{animation:fly1 .8s cubic-bezier(.5,0,.75,0) .5s both}
@keyframes fly0{to{transform:translate(-28%,-105%) scale(.22) rotate(-10deg);opacity:0}}
@keyframes fly1{to{transform:translate(28%,-105%) scale(.22) rotate(10deg);opacity:0}}
.pcard.drop{animation:drop .6s ease-in .15s both}
@keyframes drop{to{transform:translateY(24px) scale(.94);opacity:0}}
.late{display:flex;flex-direction:column;gap:12px;animation:late .35s var(--out) var(--ld,0ms) both}
@keyframes late{from{opacity:0;visibility:hidden;transform:translateY(8px)}to{opacity:1;visibility:visible}}

/* bidding */
.price{display:flex;align-items:center;justify-content:center;gap:14px;min-height:50px}
.price .amt{font:800 44px/1 var(--num);color:var(--money);font-variant-numeric:tabular-nums;display:inline-block}
.price .amt.bump{animation:bump .45s var(--out)}
@keyframes bump{35%{transform:scale(1.28) translateY(-3px);color:#9ff5cd}}
.price .by{font-size:14px;color:var(--muted);line-height:1.3}
.status{font-size:15px;text-align:center;font-weight:600;min-height:22px}
.status.sub{font-weight:400;color:var(--muted);font-size:14px}
.acts{display:grid;gap:8px}
.acts.g2{grid-template-columns:1fr 1fr}
.acts.g3{grid-template-columns:repeat(3,1fr)}
.raise .btn{min-height:56px;font:800 19px/1.1 var(--display)}
.sold{text-align:center;padding:4px 0;font-size:16px;font-weight:600}
.log{list-style:none;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:13.5px;padding:8px 12px;border-radius:12px;background:var(--panel);box-shadow:inset 3px 0 0 var(--t)}
.log li.b{box-shadow:inset 3px 0 0 var(--ct)}
.log li.skip{box-shadow:inset 3px 0 0 var(--line);color:var(--muted)}
.log li.new{animation:slidein .45s var(--out)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
.log .rt{font:700 12px/1 var(--num);color:var(--rc);font-variant-numeric:tabular-nums}
.log .pr{font-weight:700;font-variant-numeric:tabular-nums}

/* coin toss for the first card */
.flip{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,9,14,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeout .35s ease 1.3s forwards}
.flip div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 20px}
.coin{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--t) 0 50%,var(--ct) 0 100%);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 40px rgba(136,71,255,.35);animation:spin 1s cubic-bezier(.3,.7,.4,1)}
.flip h2{font-size:21px}
@keyframes spin{from{transform:rotateY(0) scale(.6)}to{transform:rotateY(1440deg) scale(1)}}
@keyframes fadeout{to{opacity:0;visibility:hidden}}

/* result */
.board{border-radius:22px;padding:18px 12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;background:linear-gradient(180deg,#171e2c,#111622);box-shadow:inset 0 0 0 1px var(--line)}
.bteam{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bname{font-weight:600;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{font:800 clamp(24px,7.6vw,40px)/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:opacity .5s,transform .5s var(--out)}
#s0{color:var(--t)} #s1{color:var(--ct)}
.led.dimmed{opacity:.32}
.bteam.won .led{transform:scale(1.08);text-shadow:0 0 28px currentColor}
.bmid{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:4px}
.vs{font:700 14px/1 var(--display);color:var(--muted)}
.mapn{font-size:12px;color:var(--muted);white-space:nowrap}
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcol{background:var(--panel);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:inset 0 3px 0 var(--t),inset 0 0 0 1px var(--line)}
.rcol.b{box-shadow:inset 0 3px 0 var(--ct),inset 0 0 0 1px var(--line)}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 4px;font-size:14px;transition:opacity .35s,transform .45s var(--out)}
.rrow+.rrow{border-top:1px solid var(--line)}
.rrow.hid{opacity:0;transform:translateX(-14px)}
.rcol.b .rrow.hid{transform:translateX(14px)}
.rrow .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .n small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow b{font:700 15px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--rc)}
.rrow .st{font-style:normal;color:var(--r-gold)}
.rsum{display:flex;justify-content:space-between;align-items:baseline;padding:9px 4px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rsum b{font:700 14px/1 var(--num);color:var(--ink);font-variant-numeric:tabular-nums}
.banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0}
.banner h2{font-size:clamp(26px,8vw,36px);line-height:1.05;animation:win .6s var(--out)}
@keyframes win{from{transform:scale(.7);opacity:0}}
.after{display:flex;flex-direction:column;gap:12px}
.stat{font-size:14px;color:var(--muted);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:34%;width:8px;height:13px;border-radius:2px;animation:conf var(--d) cubic-bezier(.2,.6,.35,1) var(--dl) both}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}35%{transform:translate(calc(var(--x)*.6),-18vh) rotate(calc(var(--r)*.4));opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* lobby */
.codebox{background:linear-gradient(180deg,#171e2c,#111622);box-shadow:inset 0 0 0 1px var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.codebox .led{font-size:48px;letter-spacing:.18em;padding-left:.18em;color:var(--ink)!important}
.lseats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lseat{background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:inset 0 3px 0 var(--t),inset 0 0 0 1px var(--line)}
.lseat.b{box-shadow:inset 0 3px 0 var(--ct),inset 0 0 0 1px var(--line)}
.lseat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--money);font-size:13px;font-weight:600}
.wait{color:var(--muted);font-size:13px}
.net{font-size:12.5px;color:var(--muted);text-align:center}
.net.bad{color:var(--loss)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,8,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line);animation:sheet .35s var(--out)}
@keyframes fadein{from{opacity:0}}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:21px}
.sheet ol{padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#cfd8e6}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.3s var(--out);z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- v3 additions ---- */
.otsep{font:800 9px/12px var(--num);color:var(--r-gold);padding:0 4px;margin:0 2px;border-radius:3px;background:rgba(228,174,57,.14);align-self:center}
.mapn.ot{color:var(--r-gold);font-weight:700}

/* hub */
.hub .hubhero{padding-top:44px}
.hub .hubhero h1{font-size:clamp(46px,15vw,92px)}
.brand{display:inline-flex;align-items:center;gap:.16em}
.brand .mark{width:1.02em;height:1.02em;flex:none;overflow:visible;margin-top:.06em}
.mark .lf{fill:var(--t);transform-origin:23px 52px;transform:rotate(-16deg)}
.mark .rt{fill:var(--ct);transform-origin:41px 52px;transform:rotate(16deg)}
.mark .fr{fill:var(--ink)}
.mark .dl{fill:none;stroke:var(--bg);stroke-width:4.2;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .hub .mark .lf{animation:fanl .7s var(--out) .15s both}.hub .mark .rt{animation:fanr .7s var(--out) .15s both}
  @keyframes fanl{from{transform:rotate(0)}}@keyframes fanr{from{transform:rotate(0)}}
}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub .tiles{margin-top:18px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:14px;border-radius:18px;min-height:118px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 60%),var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s var(--out),box-shadow .2s}
.tile:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 60%,transparent),0 12px 30px -18px var(--acc)}
.tile:active{transform:scale(.97)}
.tile:first-child{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center}
@media (max-width:899px){.tile:last-child:nth-child(even){grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center}}
.ticon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 18%,var(--raise));color:var(--acc);flex:none}
.ticon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:800 18px/1.15 var(--display)}
.tile small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.3}
.backhub{position:absolute;top:14px;left:16px;z-index:2}
.home .gname{color:var(--acc);font-size:clamp(38px,11vw,72px);text-wrap:balance}
.nbaseg button{font:800 15px/1 var(--num)}
@media (min-width:900px){.hub{display:block}.tiles{grid-template-columns:repeat(3,1fr)}.tile:first-child{grid-column:span 2;min-height:118px}
  .hub .me{max-width:520px;margin:0 auto}.hub .tiles{margin-top:40px}.hub .hubhero{padding-top:40px;margin-bottom:6px}}
/* other-game match feed */
.feed2 .dl2{font-size:13.5px;padding:4px 2px;border-bottom:1px solid var(--line);animation:slidein .25s var(--out)}
.feed2 .dl2:first-child{font-weight:600}
.feed2 .dl2 i{font-style:normal;color:var(--muted);font-size:12px;margin:0 3px}
.hp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hp i{display:block;height:8px;border-radius:99px;background:var(--t);transition:width .25s ease;width:100%}
.hp i+i{background:var(--ct);justify-self:end}
/* reveals for the other games */
.stage.reeling .rv{opacity:1}
.rv{position:absolute;inset:0;z-index:3;border-radius:22px;overflow:hidden;pointer-events:none;display:grid;place-items:center;opacity:0}
.stage.rs-walkout.reeling .pcard{visibility:visible;animation:silh calc(1100ms) linear both}
@keyframes silh{0%,62%{filter:brightness(0) drop-shadow(0 0 18px var(--rc))}100%{filter:none}}
.rv-walk{background:transparent}
.rv-walk .flash{position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 60%);opacity:0;animation:flash .5s ease-out calc(var(--rd,0ms) + 560ms) both}
@keyframes flash{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.rv-lights{background:#07090e;display:flex;gap:12px;justify-content:center;align-items:center}
.rv-lights i{width:34px;height:34px;border-radius:50%;background:#2a0d0d;box-shadow:inset 0 0 0 3px #111;animation:redon .1s linear calc(var(--rd,0ms) + var(--d)) both,redoff .1s linear calc(var(--rd,0ms) + 900ms) both}
.rv-lights i:nth-child(1){--d:80ms}.rv-lights i:nth-child(2){--d:230ms}.rv-lights i:nth-child(3){--d:380ms}.rv-lights i:nth-child(4){--d:530ms}.rv-lights i:nth-child(5){--d:680ms}
@keyframes redon{to{background:#ff2b2b;box-shadow:0 0 22px #ff2b2b,inset 0 0 0 3px #400}}
@keyframes redoff{to{background:#2a0d0d;box-shadow:inset 0 0 0 3px #111}}
.rv-crate{background:#0a0d14}
.crate{position:relative;width:min(66%,260px);aspect-ratio:5/4;animation:shake .5s ease-in-out var(--rd,0ms) 2}
.crate .box{position:absolute;left:0;right:0;bottom:0;height:78%;border-radius:12px;background:repeating-linear-gradient(90deg,#7a4a22 0 44px,#6a3f1c 44px 47px);box-shadow:inset 0 0 0 6px #4a2a10,0 22px 40px -14px rgba(0,0,0,.75)}
.crate .box::before,.crate .box::after{content:"";position:absolute;left:6px;right:6px;height:6px;background:#4a2a10}
.crate .box::before{top:30%}.crate .box::after{top:64%}
.crate .burst{position:absolute;left:-10%;right:-10%;top:0;height:46%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--rc,#ffd25e) 70%,#fff),transparent);opacity:0;animation:burst .55s ease-out calc(var(--rd,0ms) + 700ms) both}
.crate .lid{position:absolute;left:-14px;right:-14px;top:0;height:23%;border-radius:10px;background:#8a5628;box-shadow:inset 0 0 0 6px #4a2a10;transform-origin:10% 100%;animation:lid .5s cubic-bezier(.5,0,.6,1) calc(var(--rd,0ms) + 640ms) both}
@keyframes burst{35%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(2.3)}}
@keyframes lid{to{transform:translate(-90px,-180px) rotate(-70deg);opacity:0}}
.rv-asm{background:transparent}
.rv-asm i{position:absolute;width:33.4%;height:33.4%;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 40%,#1a2131),#121722);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 60%,transparent);
  animation:piece .5s var(--out) calc(var(--rd,0ms) + var(--k) * 55ms) both,fadeout .2s ease calc(var(--rd,0ms) + 980ms) forwards}
@keyframes piece{from{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(.6);opacity:0}}
.rv-cap{background:#0a0d14}
.cap{position:relative;width:110px;height:110px;animation:wobble .5s ease-in-out var(--rd,0ms) 1}
.cap b{position:absolute;left:0;right:0;height:55px}
.cap .top{top:0;border-radius:55px 55px 0 0;background:linear-gradient(#ff8fc1,#e2508f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);animation:capup .45s var(--out) calc(var(--rd,0ms) + 560ms) both}
.cap .bot{bottom:0;border-radius:0 0 55px 55px;background:linear-gradient(#f2f4f8,#c9cfdb);animation:capdown .45s var(--out) calc(var(--rd,0ms) + 560ms) both}
@keyframes capup{to{transform:translateY(-140px) rotate(-25deg);opacity:0}}
@keyframes capdown{to{transform:translateY(140px) rotate(15deg);opacity:0}}
@keyframes wobble{25%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.rv-door{background:transparent}
.rv-door b{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(0deg,#0c1220 0 18px,#101a2e 18px 20px);box-shadow:inset 0 0 0 1px #24324d}
.rv-door .dl{left:0;border-right:2px solid #ff3d55;box-shadow:inset 0 0 0 1px #24324d,6px 0 18px -4px #ff3d55;animation:doorl .5s cubic-bezier(.6,0,.3,1) calc(var(--rd,0ms) + 520ms) both}
.rv-door .dr{right:0;border-left:2px solid #4cc3ff;box-shadow:inset 0 0 0 1px #24324d,-6px 0 18px -4px #4cc3ff;animation:doorr .5s cubic-bezier(.6,0,.3,1) calc(var(--rd,0ms) + 520ms) both}
@keyframes doorl{to{transform:translateX(-102%)}}
@keyframes doorr{to{transform:translateX(102%)}}
.rv-pour{background:#0a0d14;--lq1:#ffd25e;--lq2:#e8921d;--fm:#fff6df}
.rv-pour.st-dark{--lq1:#5a2c12;--lq2:#1d0d06;--fm:#e9cfa6}
.rv-pour.st-wheat{--lq1:#ffe08a;--lq2:#f0b443;--fm:#fffaf0}
.rv-pour.st-light{--lq1:#fff0a8;--lq2:#f3cf5c;--fm:#ffffff}
.rv-pour .glass{position:relative;width:96px;height:140px;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--rc,#4DB8FF) 45%,transparent));animation:cheers .24s ease-in calc(var(--rd,0ms) + 860ms) both}
.rv-pour .gin{position:absolute;inset:0;clip-path:polygon(4% 1%,96% 1%,85% 97%,15% 97%);background:rgba(220,235,255,.05)}
.rv-pour svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rv-pour svg path{fill:none;stroke:rgba(225,238,255,.75);stroke-width:3;stroke-linejoin:round}
.rv-pour .liq{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--lq1),var(--lq2));animation:fillup .6s cubic-bezier(.3,.6,.4,1) calc(var(--rd,0ms) + 120ms) both}
.rv-pour .foam{position:absolute;left:0;right:0;bottom:76%;height:0;background:var(--fm);border-radius:10px 10px 0 0;animation:foamup .28s ease-out calc(var(--rd,0ms) + 640ms) both}

.rv-pour .stream{position:absolute;left:calc(50% - 3px);top:calc(50% - 130px);width:6px;height:0;border-radius:3px;background:linear-gradient(var(--lq1),var(--lq2));animation:stream .7s linear calc(var(--rd,0ms) + 40ms) both}
@keyframes fillup{to{height:76%}}
@keyframes foamup{to{height:20%}}
@keyframes bub{0%{opacity:0;transform:translateY(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-92px)}}
@keyframes stream{0%{height:0}18%,82%{height:140px;transform:none;opacity:1}100%{height:0;transform:translateY(140px);opacity:0}}
@keyframes cheers{to{transform:translateY(-26px) rotate(-10deg) scale(1.08);opacity:0}}
.stage.rs-door .pcard,.stage.rs-assemble .pcard{visibility:visible}
.stage.reeling.rs-door .pcard,.stage.reeling.rs-assemble .pcard{visibility:visible}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.who-line{font-size:15px;color:var(--muted)}
.who-line b{color:var(--ink)}
.home .side{display:flex;flex-direction:column;gap:12px}
.me{background:var(--panel);border-radius:18px;padding:14px 16px 16px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.me input{background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:13px 14px;font-size:17px;font-weight:600;width:100%;transition:box-shadow .15s}
.me input:focus{box-shadow:inset 0 0 0 2px var(--t);outline:none}
.me input.shake{box-shadow:inset 0 0 0 2px var(--loss);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.me .recn{justify-content:space-around;padding-top:6px}
.recn span{text-align:center}
.recn b{text-align:center}
.links{display:flex;justify-content:center;gap:8px}
/* GOAT alert */
.goatov{position:fixed;inset:0;z-index:36;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,rgba(244,197,66,.28),rgba(6,9,14,.9) 70%);animation:goatIn .45s var(--out) var(--gd) both,fadeout .4s ease calc(var(--gd) + 2.2s) forwards;cursor:pointer}
.goat-in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px}
.goat-k{font:800 clamp(44px,15vw,84px)/1 var(--num);letter-spacing:.02em;background:linear-gradient(180deg,#fff3c4,#f4c542 55%,#b77b12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(244,197,66,.55));animation:goatPulse 1.2s ease-in-out infinite}
.goatov .mini{transform:scale(1.15);margin:8px 0}
.goat-in>b{font:800 22px/1.1 var(--num)}
.goat-c{font-weight:700;color:#f4c542;background:rgba(244,197,66,.12);padding:5px 12px;border-radius:99px}
@keyframes goatIn{from{opacity:0;transform:scale(1.15)}}
@keyframes goatPulse{50%{filter:drop-shadow(0 0 34px rgba(244,197,66,.85))}}
.pcard.goat::before{background:linear-gradient(105deg,transparent 30%,rgba(255,236,170,.35) 50%,transparent 70%)}
.pcard.goat{box-shadow:inset 0 0 0 2px var(--rc),0 0 40px -6px color-mix(in srgb,var(--rc) 70%,transparent)}
/* match */
.strip{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:12px}
.strip i{width:10px;height:12px;border-radius:3px;background:var(--t);animation:pop .4s var(--out)}
.strip i.b{background:var(--ct)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid .feed{grid-column:1/-1;grid-row:1}
.feed{background:var(--panel);border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px;min-height:120px}
.duels{list-style:none;display:flex;flex-direction:column;gap:4px}
.dl{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:6px;align-items:center;font-size:13.5px;animation:slidein .25s var(--out)}
.dl>span:first-child{text-align:right}
.dl .w{font-weight:700}
.dl .l{opacity:.45;text-decoration:line-through;text-decoration-thickness:1.5px}
.dl .pc{font:600 11.5px/1 var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.dl i{font-style:normal;font-size:11px;color:var(--muted)}
.dl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow{animation:slidein .4s var(--out) calc(var(--i,0)*60ms) both}
.rrow .kd{font:700 14px/1 var(--num);color:var(--ink)}
.rrow.mvp{background:rgba(228,174,57,.1);border-radius:10px}
.rrow.mvp .n::after{content:" MVP";font:800 10px/1 var(--num);color:var(--r-gold);vertical-align:middle}
.led.bump{animation:bump .45s var(--out)}
.streakline{color:#ffb35c;font-weight:700}
/* players sheet */
.sheet.tall{height:88%;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptools{display:flex;flex-direction:column;gap:8px}
.ptools input{background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
.ptools input:focus{box-shadow:inset 0 0 0 2px var(--t);outline:none}
.seg.two{grid-template-columns:1fr 1fr}
.plist{overflow:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px}
.plist h3{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 4px}
.plist ul{list-style:none;display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.prow .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .n small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:normal}
.prow b{font:700 15px/1 var(--num);color:var(--rc)}
.own{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.06);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* phone: keep the draft on one screen */
@media (max-width:420px){
  .wrap{padding:12px 12px 40px;gap:12px}
  .pcard{min-height:196px;padding:14px 14px 18px}
  .ava.lg{width:64px;height:64px}
  .mgr{padding:10px}
  .mgr .cash{font-size:20px}
}
@media (max-height:700px){.pcard{min-height:180px}.ava.lg{width:56px;height:56px}.price .amt{font-size:38px}}
/* desktop */
@media (min-width:900px){
  .wrap{max-width:560px;padding-top:24px}
  .wrap.wide{max-width:1140px}
  .home{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;min-height:calc(100vh - 48px)}
  .home .hero{gap:18px}
  .home .fan{height:240px}
  .home .fan .mini{width:150px;height:200px;margin-left:-75px}
  .home .fan .mini .ava{width:70px;height:70px}
  .home .fan .mini:nth-child(1){--x:-130px}
  .home .fan .mini:nth-child(3){--x:130px}
  .home .hero h1{font-size:84px}
  .lede{font-size:17px}
  .dgrid{display:grid;grid-template-columns:290px minmax(0,1fr) 290px;gap:20px;align-items:start}
  .dgrid .mgrs{display:contents}
  .dgrid .mgr{grid-row:1/span 2;position:sticky;top:16px}
  .dgrid .mgr:not(.b){grid-column:1}
  .dgrid .mgr.b{grid-column:3}
  .dgrid>.block{grid-column:2;grid-row:1}
  .dgrid>.logwrap{grid-column:2;grid-row:2}
  .mgr{padding:16px;gap:10px}
  .mgr .cash{font-size:28px}
  .who{flex-direction:column;gap:6px;min-height:150px}
  .rp{padding:4px 10px 4px 4px;font-size:14px;border-radius:12px}
  .rp b{display:block}
  .ava.xs{width:26px;height:26px}
  .pcard{min-height:280px;padding:22px 22px 26px}
  .ava.lg{width:96px;height:96px}
  .pc-nick{font-size:40px}
  .pc-rating b{font-size:40px}
  .mgrid{grid-template-columns:1fr minmax(0,1.1fr) 1fr;align-items:start}
  .mgrid .feed{grid-column:2;grid-row:1;min-height:320px}
  .led{font-size:64px}
  .board{padding:24px}
  .strip i{width:14px;height:16px}
  .dl{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flip{display:none}.stage.reeling .pcard{visibility:visible}.stage.reeling .reel{display:none}.rrow,.dl{opacity:1}}
</style>
</head>

  rulesCommon:(f,gift)=>['Хоёулаа $20 мөнгөтэй эхэлнэ. Карт нэг нэгээр гарч, ээлжлэн нээнэ. Сайн картууд эрт гарах магадлал ихтэй.',gift?`Нээх ээлжтэй үедээ $1-ээр нээнэ эсвэл картыг өрсөлдөгчдөө өгнө (2 удаа). Өгөхдөө түүнд $${f} төлнө. Өрсөлдөгчийн хоосон суудал 3-аас эсвэл таныхаас цөөн бол өгч болохгүй. Нээсний дараа нөгөө нь +$1, +$2, +$5, бүх мөнгөөрөө эсвэл бичсэн дүнгээр өсгөнө. Өнжвөл сүүлд үнэ хэлсэн нь авна.`:'Нээх ээлжтэй үедээ $1-ээр нээнэ. Баг жижиг тул картыг өрсөлдөгчдөө өгөх боломжгүй. Нээсний дараа нөгөө нь +$1, +$2, +$5, бүх мөнгөөрөө эсвэл бичсэн дүнгээр өсгөнө. Өнжвөл сүүлд үнэ хэлсэн нь авна.','Мөнгө дуусвал өрсөлдөгч $0-оор өгнө. Нэг талын баг бүрдвэл үлдсэн карт нөгөөд нь дарааллаараа автоматаар очно. Хоёулаа санал нийлвэл картыг хэн ч авалгүй алгасаж болно. Ээлж бүрт 15 секунд.'],
  rules_f1:['Хүн бүр 2 нисгэгч, 2 машин авна. Нисгэгчийн rating нь 2026 оны улирлын оноо, машиных нь тухайн багийн 2 нисгэгчийн онооны нийлбэрээр тооцсон.','Хамгийн сайн нисгэгч хамгийн сайн машинаа унана. Хурд нь нисгэгч, машин хоёрын rating-ийн дундаж. Дөрвөн машин 15 тойрог уралдана: гараа, пит-стоп, гүйцэж түрүүлэлт, ховор DNF бий.','Байр: P1 25, P2 18, P3 15, P4 12 оноо. Нийт оноо их баг ялна. Нэг багийн нисгэгч, машин хоёр хамт байвал +3%, гурав бол +6%.'],
  rules_nba:['3x3 бол 3 тоглогч, 5x5 бол 5 тоглогч. Rating нь NBA 2K27.','5x5: 4 үе, тэнцвэл нэмэлт цаг. 3x3: 21 оноо түрүүлж авсан нь ялна, дотроос 1, гаднаас 2 оноо.','Үүрэг чухал: PG алдааг багасгаж шидэлтийг сайжруулна, C самбар болон хамгаалалтыг сайжруулна. Шидэгчийг rating болон үүргээр сонгоно.'],
  rules_fifa:['5 хүнтэй баг (futsal шиг). Rating нь EA FC 27.','90 минутад довтолгоо бүрийн боломжийг довтлогч, хагас хамгаалагчийн хүч хамгаалалтынхтай харьцуулж тооцно. Хаалгачгүй бол хамгийн сул тоглогч хаалга хамгаална.','Тэнцвэл пенальти цохино. Нэг клубын тоглогчид +3% ба түүнээс дээш.'],
  rules_food:['5 хоолтой цэс бүрдүүлнэ. Амтны оноо нь Draftly-н үнэлгээ.','Хоолнууд дарааллаараа нэг нэгээрээ өрсөлдөнө. 5 шүүгч тус бүр санал өгнө, амт сайн нь илүү санал авах магадлалтай.','Цэс олон янз байвал (4-5 төрөл) хоол бүрт нэмэлт оноо. 5 хоолноос 3-ыг хожсон нь ялна.'],
  rules_beer:['5 шар айрагтай багц бүрдүүлнэ. Үнэлгээ нь Untappd дээрх бодит дундаж оноо (5-аас).','Шар айрагнууд дарааллаараа нэг нэгээрээ сохор амталгаанд орно. Шүүгчид хөөс, үнэр, амтыг тус бүр 10 онооноос дүгнэнэ. Хар болон улаан буудайн шар айраг хөөс, үнэрээрээ, лагер амтаараа давуу.','Монгол шар айраг бүр нутгийн бонус авна. 3 төрөл (лагер, хар, улаан буудайн, хөнгөн) цуглуулбал бага, 4 төрөл бол их бонус. 5 тойргоос 3-ыг хожсон нь ялна.'],
  rules_anime:['5 дүртэй баг. Хүчний үнэлгээ нь Draftly-н фэн үнэлгээ.','Дүрүүд дарааллаараа 1v1 тулалдана. Цохилт бүрийн магадлалыг хүчээр тооцно, заримдаа CRIT гарна.','5 тулаанаас 3-ыг хожсон нь ялна. Нэг цувралын дүрүүд +3% ба түүнээс дээш.'],
  rules_marvel:['5 баатартай баг. Хүчний үнэлгээ нь Draftly-н фэн үнэлгээ.','Баатрууд дарааллаараа 1v1 тулалдана. Цохилт бүрийн магадлалыг хүчээр тооцно, заримдаа CRIT гарна.','5 тулаанаас 3-ыг хожсон нь ялна. Нэг багийн (Avengers, X-Men гэх мэт) баатрууд +3% ба түүнээс дээш.'],
  rules:x=>[
    'Хоёулаа $20 мөнгөтэй, 5 хоосон суудалтай эхэлнэ. Мөнгө нь виртуал.',
    'Тамирчдын карт санамсаргүй дарааллаар нэг нэгээр гарна, гэхдээ өндөр rating-тэй тамирчид эрт гарах магадлал ихтэй. Карт бүрийг та хоёр ээлжлэн нээнэ.',
    `Нээх ээлжтэй үедээ картыг $1-ээр нээнэ, эсвэл өрсөлдөгчдөө өгнө (2 удаа). Өгөхдөө түүнд $${GIFT_FEE} төлнө. Өрсөлдөгчийн хоосон суудал 3-аас эсвэл таныхаас цөөн бол өгч болохгүй.`,
    'Нээсний дараа нөгөө нь үнээ +$1, +$2, +$5, бүх мөнгөөрөө эсвэл өөрийн бичсэн дүнгээр өсгөнө. Өнжвөл хамгийн сүүлд үнэ хэлсэн нь авна.',
    'Мөнгө дуусаад суудал үлдсэн бол өрсөлдөгч тань хүсээгүй картаа танд $0-оор өгнө. Нэг талын баг бүрдсэн бол үлдсэн тамирчид нөгөөд нь дарааллаараа автоматаар очно. Хоёулаа санал нийлвэл картыг хэн ч авалгүй алгасаж болно.',
    'Ээлж бүрт 15 секунд. Цаг дуусвал нээх үед $1-ээр авна, хаялцах үед өнжинө.',

    if(a==='take'){
      if(g.kind==='normal'&&g.money[1-t]>=2){g.phase='bid';g.bid=1;g.hi=t;g.actor=1-t;g.deadline=now+TURN_MS;g.seq++;}
      else award(g,t,1,'bid');
    }else if(a==='give'){g.gives[t]--;g.money[t]-=GIFT_FEE;g.money[1-t]+=GIFT_FEE;award(g,1-t,0,'give');}
    else if(a==='pass')award(g,1-t,0,'zero');
    return true;
  }
  if(g.phase==='bid'){
    if(a==='pass'){award(g,g.hi,g.bid,'bid');return true;}
    v=Math.floor(+v);
    if(!(v>g.bid&&v<=g.money[t]))return false;
    g.bid=v;g.hi=t;
    if(g.money[1-t]>v){g.actor=1-t;g.deadline=now+TURN_MS;g.seq++;}
    else award(g,t,v,'bid');
    return true;
  }
  return false;
}
/* automatic steps; returns true if state changed */
function stepClock(g){
  const now=Date.now();
  if(now<=g.deadline)return false;
  if(g.phase==='offer')return act(g,g.actor,'take');
  if(g.phase==='bid')return act(g,g.actor,'pass');
  if(g.phase==='sold'){nextCard(g);return true;}
  if(g.phase==='auto'){award(g,g.autoTo,0,'zero');return true;}
  return false;
}

// Players from the same real team get a small boost: 2 → +3%, 3 → +6%, 4 → +8%, 5 → +10%.
const BUFF=[0,0,.03,.06,.08,.10],WIN_ROUNDS=13,OT_ROUNDS=3,DUEL_K=3;
function teamCounts(ids){const c={};ids.forEach(i=>{const t=P[i].team;c[t]=(c[t]||0)+1;});return c;}
// Reasons to take weaker players: an IGL lifts every teammate, and a sub-1.00 player is stronger in a clutch.
const LEAD=.03,CLUTCH=.20,UNDERDOG=100;
const isIGL=p=>/IGL/.test(p.role);
const leaderOf=ids=>ids.find(i=>isIGL(P[i]));
const buffOf=(ids,i)=>{if(GK!=='cs2')return GM.syn==='group'?BUFF[Math.min(5,teamCounts(ids)[P[i].team]||0)]:0;const l=leaderOf(ids);return BUFF[Math.min(5,teamCounts(ids)[P[i].team]||0)]+(l!=null&&l!==i?LEAD:0);};
const effOf=ids=>ids.map(i=>P[i].hl*(1+buffOf(ids,i)));
// chance that a player with effective rating a wins a 1v1 against b
const duelP=(a,b)=>{const x=Math.pow(a,DUEL_K),y=Math.pow(b,DUEL_K);return x/(x+y);};
function rosterAvg(ids){return ids.length?ids.reduce((a,i)=>a+P[i].hl,0)/ids.length:0;}
function playMatch(g){
  const R=g.rost,E=[effOf(R[0]),effOf(R[1])],score=[0,0],rounds=[];
  const K=[R[0].map(()=>0),R[1].map(()=>0)],D=[R[0].map(()=>0),R[1].map(()=>0)];
  let target=WIN_ROUNDS,ot=0;
  for(;;){
    if(score[0]===target-1&&score[1]===target-1){target+=OT_ROUNDS;ot++;}   // 12:12, 15:15, … → overtime
    if(rounds.length>=80)target=Math.max(score[0],score[1])+1;               // safety: sudden death
    const alive=[R[0].map((_,i)=>i),R[1].map((_,i)=>i)],duels=[];
    while(alive[0].length&&alive[1].length){
      const a=alive[0][Math.floor(Math.random()*alive[0].length)],b=alive[1][Math.floor(Math.random()*alive[1].length)];
      const ca=alive[0].length===1&&P[R[0][a]].hc<UNDERDOG,cb=alive[1].length===1&&P[R[1][b]].hc<UNDERDOG;
      const p=duelP(E[0][a]*(ca?1+CLUTCH:1),E[1][b]*(cb?1+CLUTCH:1)),w=Math.random()<p?0:1;
      duels.push([a,b,Math.round(p*100),w,(ca?1:0)|(cb?2:0)]);
      if(w===0){K[0][a]++;D[1][b]++;alive[1].splice(alive[1].indexOf(b),1);}
      else{K[1][b]++;D[0][a]++;alive[0].splice(alive[0].indexOf(a),1);}
    }
    const rw=alive[0].length?0:1;score[rw]++;
    rounds.push(rw+duels.map(d=>`${d[0]}${d[1]}${String(clamp(d[2],1,99)).padStart(2,'0')}${d[3]}${d[4]}`).join(''));
    if(score[0]>=target||score[1]>=target)break;
  }
  const win=score[0]>score[1]?0:1;
  let mvp=0;R[win].forEach((_,i)=>{if(K[win][i]-D[win][i]>K[win][mvp]-D[win][mvp])mvp=i;});
  return {score,rounds,K,D,win,mvp,ot,E:E.map(e=>e.map(x=>Math.round(x*1000)/1000))};
}
// decode one round string back to [winner,[[a,b,p,w,c],…]]
const decR=s=>[+s[0],Array.from({length:(s.length-1)/6},(_,k)=>{const q=s.substr(1+k*6,6);return [+q[0],+q[1],+q.substr(2,2),+q[4],+q[5]];})];
function toMatch(g){g.phase='match';g.actor=-1;g.cur=null;g.res=(g.game||'cs2')==='cs2'?playMatch(g):playOther(g);g.seq++;}

const GAME_KEYS=Object.keys(GAMES);
Object.values(GAMES).forEach(g=>{g.P=g.mk();});
let GK='cs2',GM=GAMES.cs2;
function useGame(key,sub){
  GK=GAMES[key]?key:'cs2';GM=GAMES[GK];
  P=GM.P;TEAMS=GM.groups();PRIMES=P.filter(p=>p.special).map(p=>p.id);
  const s=GM.slots;GM.sub=s[sub]?sub:Object.keys(s)[0];SLOTS=s[GM.sub];
}
const gsub=()=>GK==='nba'?' '+GM.sub:'';
const roleName=p=>p.ty==='car'?T('f1car'):GK==='food'?T('cat_'+p.cat):GK==='beer'?T('st_'+p.role):GK==='anime'||GK==='marvel'?T('side_'+p.role):p.role;
const teamName=p=>p.ty==='car'?T('constrN',p.crank):GK==='food'?T('cat_'+p.cat):GK==='beer'?p.br:p.team;
const grpName=k=>GK==='food'?T('cat_'+k):GK==='beer'?T('reg_'+k):k;

/* ================= simulations (seeded, so host and guest replay the same match) ================= */
const mkRng=seed=>{let a=seed>>>0;return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};};
const gauss=r=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
const wpick=(r,w)=>{const tot=w.reduce((a,b)=>a+b,0);let x=r()*tot;for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i;}return w.length-1;};
const pw=(a,b,k)=>{const x=Math.pow(a,k),y=Math.pow(b,k);return x/(x+y);};
const grpBuff=(ids,id)=>GM.syn==='group'?BUFF[Math.min(5,teamCounts(ids)[P[id].team]||0)]:0;

function simF1(R,sub,seed){
  const r=mkRng(seed),L=15,PTS=[25,18,15,12],cars=[];
  R.forEach((ids,t)=>{   // best driver gets the best car; pace = driver/car average + same-team bonus
    const pick=ty=>ids.map((id,i)=>({id,i})).filter(x=>(P[x.id].ty||'drv')===ty).sort((a,b)=>P[b.id].hl-P[a.id].hl),car=pick('car');
    pick('drv').forEach((d,k)=>{const c=car[k];
      cars.push({t,i:d.i,ci:c?c.i:-1,id:d.id,pace:(c?(P[d.id].hl+P[c.id].hl)/2:P[d.id].hl)*(1+grpBuff(ids,d.id)),time:0,out:false,pit:6+Math.floor(r()*5),best:1e9});});});
  cars.forEach(c=>c.q=c.pace+gauss(r)*1.3);
  const grid=cars.slice().sort((a,b)=>b.q-a.q);grid.forEach((c,k)=>{c.time=k*.45;});
  const steps=[],ordOf=list=>list.map(c=>[c.t,c.i]);
  const pts=order=>{const s=[0,0];order.filter(c=>!c.out).forEach((c,k)=>s[c.t]+=PTS[k]||0);return s;};
  let order=grid.slice();steps.push({ph:['lap',0,L],ord:ordOf(order),sc:pts(order),ev:[{e:'start',a:[order[0].t,order[0].i]}]});
  let fl=null;
  for(let lap=1;lap<=L;lap++){
    const ev=[];
    cars.forEach(c=>{if(c.out)return;
      const lt=90-(c.pace-75)*.13+gauss(r)*.42+(lap===c.pit?21:0);
      c.time+=lt;if(lap!==c.pit&&lt<c.best){c.best=lt;if(!fl||lt<fl.t)fl={t:lt,c};}
      if(lap===c.pit)ev.push({e:'pit',a:[c.t,c.i]});
      if(r()<.0016){c.out=true;ev.push({e:'dnf',a:[c.t,c.i]});}});
    const prev=order.map(c=>c.id),next=cars.filter(c=>!c.out).sort((a,b)=>a.time-b.time).concat(cars.filter(c=>c.out));
    next.forEach((c,k)=>{if(c.out||lap===c.pit)return;const was=prev.indexOf(c.id);
      if(was>k){const passed=order.slice(k,was).filter(x=>!x.out&&x.pit!==lap&&next.indexOf(x)>k);
        passed.forEach(x=>ev.push({e:'pass',a:[c.t,c.i],b:[x.t,x.i],pos:k+1}));}});
    order=next;
    if(lap===L)ev.push({e:'finish',a:[order[0].t,order[0].i]});
    steps.push({ph:['lap',lap,L],ord:ordOf(order),sc:pts(order),ev});
  }
  const sc=pts(order);let win=sc[0]===sc[1]?order.find(c=>!c.out).t:sc[0]>sc[1]?0:1;
  if(order.every(c=>c.out))win=0;
  const stats=[[],[]];order.forEach((c,k)=>{const v=c.out?'DNF':'P'+(k+1);stats[c.t][c.i]=v;if(c.ci>=0)stats[c.t][c.ci]=v;});
  const mv=order.find(c=>c.t===win&&!c.out)||order.find(c=>c.t===win);
  return {score:sc,win,mvp:[mv.t,mv.i],mvpS:stats[mv.t][mv.i],steps,stats,fl:fl?[fl.c.t,fl.c.i]:null};
}

function simNBA(R,sub,seed){
  const r=mkRng(seed),three=sub==='3x3',score=[0,0],stats=[R[0].map(()=>0),R[1].map(()=>0)],steps=[];
  const has=(t,pos)=>R[t].some(id=>P[id].role===pos);
  const avg=t=>R[t].reduce((a,id)=>a+P[id].hl,0)/Math.max(1,R[t].length);
  const USE={PG:1.2,SG:1.2,SF:1.1,PF:1,C:.9},P3={PG:.42,SG:.48,SF:.38,PF:.24,C:.1};
  function poss(o,ph){
    const d=1-o;if(!R[o].length)return;
    if(r()<.13-(has(o,'PG')?.04:0))return;
    for(let tries=0;tries<2;tries++){
      const k=wpick(r,R[o].map(id=>Math.pow(Math.max(1,P[id].hl-60),2)*USE[P[id].role])),p=P[R[o][k]];
      if(!three&&r()<.17){let v=0;for(let f=0;f<2;f++)if(r()<.74+(p.hl-85)*.006)v++;
        if(v){score[o]+=v;stats[o][k]+=v;steps.push({ph:ph(),sc:score.slice(),ev:[{e:'ft',a:[o,k],v}]});}return;}
      const out=r()<(three?P3[p.role]*.9:P3[p.role]);
      let pr=(out?(three?.33:.36):(three?.5:.53))+(p.hl-avg(d))*.008+(has(o,'PG')?.02:0)+(out?0:(has(d,'C')?-.03:.02));
      if(r()<clamp(pr,.15,.8)){const v=out?(three?2:3):(three?1:2);score[o]+=v;stats[o][k]+=v;steps.push({ph:ph(),sc:score.slice(),ev:[{e:'shot',a:[o,k],v,out}]});return;}
      if(r()>=.24+(has(o,'C')?.06:0)-(has(d,'C')?.05:0))return;
    }
  }
  if(three){let n=0;const ph=()=>['clock3',Math.max(0,600-Math.floor(n*7))];
    while(n<160){poss(n%2,ph);n++;if(score[0]>=21||score[1]>=21)break;if(n>=110&&score[0]!==score[1])break;}
    if(score[0]===score[1]){score[r()<.5?0:1]++;}
  }else{
    for(let q=1;q<=4||score[0]===score[1];q++){
      const N=q<=4?26:6,ot=q>4;
      for(let n=0;n<N*2;n++)poss((n+q)%2,()=>[ot?'ot':'q',ot?q-4:q,Math.max(0,(ot?300:720)-Math.floor(n*(ot?300:720)/(N*2)))]);
      if(q>12){score[r()<.5?0:1]++;break;}
    }
  }
  const win=score[0]>score[1]?0:1;let mi=0;stats[win].forEach((v,i)=>{if(v>stats[win][mi])mi=i;});
  return {score,win,mvp:[win,mi],mvpS:stats[win][mi]+' PTS',steps,stats:stats.map(a=>a.map(v=>v+''))};
}

function simFIFA(R,sub,seed){
  const r=mkRng(seed),score=[0,0],goals=[R[0].map(()=>0),R[1].map(()=>0)],saves=[R[0].map(()=>0),R[1].map(()=>0)],steps=[];
  const eff=t=>R[t].map(id=>P[id].hl*(1+grpBuff(R[t],id)));
  const E=[eff(0),eff(1)];
  const lineAvg=(t,ls)=>{const v=R[t].map((id,i)=>ls.includes(LINE(P[id].role))?E[t][i]:null).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:72;};
  const gk=t=>{const i=R[t].findIndex(id=>P[id].role==='GK');return i>=0?{i,v:E[t][i]}:{i:-1,v:Math.min(...E[t])-14};};
  const att=[lineAvg(0,['F','M']),lineAvg(1,['F','M'])],def=[lineAvg(0,['D','M']),lineAvg(1,['D','M'])],mid=[lineAvg(0,['M']),lineAvg(1,['M'])],G=[gk(0),gk(1)];
  const shooters=t=>R[t].map((id,i)=>{const l=LINE(P[id].role);return l==='G'?0:Math.max(1,E[t][i]-70)*({F:3,M:2,D:.6}[l]);});
  for(let m=0;m<36;m++){
    const min=Math.min(90,Math.round((m+1)*2.5)),o=r()<pw(mid[0],mid[1],6)?0:1,d=1-o;
    if(m===18)steps.push({ph:['min',45],sc:score.slice(),ev:[{e:'ht'}]});
    if(r()>.24+(att[o]-def[d])*.012)continue;
    const w=shooters(o);if(!w.some(x=>x))continue;
    const k=wpick(r,w),pg=clamp(.3+(E[o][k]-G[d].v)*.012,.1,.62);
    if(r()<pg){score[o]++;goals[o][k]++;const wa=shooters(o).map((x,i)=>i===k?0:x);const as=wa.some(x=>x)?wpick(r,wa):-1;
      steps.push({ph:['min',min],sc:score.slice(),ev:[{e:'goal',a:[o,k],as:as>=0?[o,as]:null}]});}
    else if(G[d].i>=0&&r()<.55){saves[d][G[d].i]++;steps.push({ph:['min',min],sc:score.slice(),ev:[{e:'save',a:[d,G[d].i],b:[o,k]}]});}
  }
  steps.push({ph:['min',90],sc:score.slice(),ev:[{e:'ft'}]});
  let pens=null,win=score[0]>score[1]?0:score[1]>score[0]?1:-1;
  if(win<0){pens=[0,0];const order=[0,1].map(t=>R[t].map((id,i)=>i).filter(i=>P[R[t][i]].role!=='GK').sort((a,b)=>E[t][b]-E[t][a]));
    for(let k=0;k<30;k++){const t=k%2,n=Math.floor(k/2),list=order[t].length?order[t]:R[t].map((_,i)=>i),i=list[n%list.length];
      const ok=r()<clamp(.76+(E[t][i]-G[1-t].v)*.008,.5,.92);if(ok)pens[t]++;
      steps.push({ph:['pens'],sc:score.slice(),pens:pens.slice(),ev:[{e:ok?'pen':'penx',a:[t,i]}]});
      const shot=[Math.ceil((k+1)/2),Math.floor((k+1)/2)];
      if(k<10){const left=[5-shot[0],5-shot[1]];if(pens[0]>pens[1]+left[1]||pens[1]>pens[0]+left[0])break;}
      else if(t===1&&pens[0]!==pens[1])break;}
    win=pens[0]>pens[1]?0:1;}
  let mi=0;goals[win].forEach((v,i)=>{if(v>goals[win][mi])mi=i;});
  if(!goals[win][mi]){const g=R[win].findIndex(id=>P[id].role==='GK');if(g>=0)mi=g;}
  const st=[0,1].map(t=>R[t].map((id,i)=>goals[t][i]?'⚽'.repeat(Math.min(3,goals[t][i]))+(goals[t][i]>3?goals[t][i]:''):P[id].role==='GK'?(saves[t][i]?saves[t][i]+'🧤':'0🧤'):'–'));
  return {score,pens,win,mvp:[win,mi],mvpS:st[win][mi],steps,stats:st};
}

function simFood(R,sub,seed){
  const r=mkRng(seed),score=[0,0],votes=[R[0].map(()=>0),R[1].map(()=>0)],steps=[];
  const variety=t=>[0,0,0,1,2,3][new Set(R[t].map(id=>P[id].cat)).size]||0,V=[variety(0),variety(1)];
  for(let k=0;k<SLOTS;k++){
    const a=R[0][k],b=R[1][k];
    if(a==null||b==null){const w=a==null?1:0;score[w]++;steps.push({ph:['course',k+1],sc:score.slice(),ev:[{e:'course',w,k}]});continue;}
    const pa=1/(1+Math.exp(-((P[a].hl+V[0])-(P[b].hl+V[1]))/5)),c=[0,0];
    steps.push({ph:['course',k+1],sc:score.slice(),ev:[{e:'serve',k}]});
    for(let j=1;j<=5;j++){const t=r()<pa?0:1;c[t]++;votes[t][k]++;steps.push({ph:['course',k+1],sc:score.slice(),ev:[{e:'vote',j,t,k,c:c.slice()}]});}
    const w=c[0]>c[1]?0:1;score[w]++;steps.push({ph:['course',k+1],sc:score.slice(),ev:[{e:'course',w,k,c}]});
  }
  const win=score[0]>score[1]?0:1;let mi=0;votes[win].forEach((v,i)=>{if(v>votes[win][mi])mi=i;});
  return {score,win,mvp:[win,mi],mvpS:votes[win][mi]+'/5',steps,stats:votes.map(a=>a.map(v=>v+'/5')),variety:V};
}

// Blind tasting: each round pours one beer per side; judges score head, aroma and taste out of 10.
// Untappd rating drives the score; styles suit some criteria; local beers get a home bonus; 3-4 styles add a variety bonus.
const BEER_CR=['foam','aroma','taste'],BEER_LOCAL=.35,BEER_VAR=[0,0,0,.25,.5];
const BEER_AFF={foam:{wheat:.35,dark:.25,lager:0,light:-.2},aroma:{dark:.35,wheat:.3,lager:0,light:-.1},taste:{lager:.2,light:.25,dark:0,wheat:0}};
function simBeer(R,sub,seed){
  const r=mkRng(seed),score=[0,0],tot=[R[0].map(()=>0),R[1].map(()=>0)],steps=[];
  const V=[0,1].map(t=>BEER_VAR[new Set(R[t].map(id=>P[id].role)).size]||0);
  const judge=(t,id,c)=>{const p=P[id];return clamp(Math.round((5+(p.hl-3)*3.2+BEER_AFF[c][p.role]+V[t]+(p.cc==='MN'?BEER_LOCAL:0)+gauss(r)*.85)*10)/10,1,10);};
  for(let k=0;k<SLOTS;k++){
    const a=R[0][k],b=R[1][k];
    if(a==null||b==null){const w=a==null?1:0;score[w]++;steps.push({ph:['round',k+1],sc:score.slice(),ev:[{e:'rwin',w,k}]});continue;}
    const c=[0,0];
    steps.push({ph:['round',k+1],sc:score.slice(),ev:[{e:'pour',k}]});
    BEER_CR.forEach((cr,j)=>{const v=[judge(0,a,cr),judge(1,b,cr)];c[0]+=v[0];c[1]+=v[1];
      steps.push({ph:['round',k+1],sc:score.slice(),ev:[{e:'crit',j,k,v}]});});
    c[0]=Math.round(c[0]*10)/10;c[1]=Math.round(c[1]*10)/10;tot[0][k]=c[0];tot[1][k]=c[1];
    const w=c[0]>c[1]?0:c[1]>c[0]?1:P[a].hl>=P[b].hl?0:1;score[w]++;
    steps.push({ph:['round',k+1],sc:score.slice(),ev:[{e:'rwin',w,k,c}]});
  }
  const win=score[0]>score[1]?0:1;let mi=0;tot[win].forEach((v,i)=>{if(v>tot[win][mi])mi=i;});
  return {score,win,mvp:[win,mi],mvpS:tot[win][mi].toFixed(1)+'/30',steps,stats:tot.map(a=>a.map(v=>v?v.toFixed(1):'–')),variety:V};
}

function simBattle(R,sub,seed){
  const r=mkRng(seed),score=[0,0],steps=[],res=[R[0].map(()=>'–'),R[1].map(()=>'–')],dmgSum=[R[0].map(()=>0),R[1].map(()=>0)];
  const E=[0,1].map(t=>R[t].map(id=>P[id].hl*(1+grpBuff(R[t],id))));
  for(let k=0;k<SLOTS;k++){
    const a=R[0][k],b=R[1][k];
    if(a==null||b==null){const w=a==null?1:0;score[w]++;steps.push({ph:['fight',k+1],sc:score.slice(),ev:[{e:'ko',w,k}]});continue;}
    const hp=[100,100],p=pw(E[0][k],E[1][k],4);
    steps.push({ph:['fight',k+1],sc:score.slice(),hp:hp.slice(),ev:[{e:'vs',k}]});
    for(let n=0;n<40&&hp[0]>0&&hp[1]>0;n++){
      const t=r()<p?0:1,crit=r()<.12,d=Math.round((12+r()*16)*(crit?1.6:1));
      hp[1-t]=Math.max(0,hp[1-t]-d);dmgSum[t][k]+=d;
      steps.push({ph:['fight',k+1],sc:score.slice(),hp:hp.slice(),ev:[{e:'hit',t,k,d,crit}]});
    }
    const w=hp[0]>0?0:1;score[w]++;res[w][k]='W';res[1-w][k]='L';
    steps.push({ph:['fight',k+1],sc:score.slice(),hp:hp.slice(),ev:[{e:'ko',w,k}]});
  }
  const win=score[0]>score[1]?0:1;let mi=0;dmgSum[win].forEach((v,i)=>{if(res[win][i]==='W'&&(res[win][mi]!=='W'||v>dmgSum[win][mi]))mi=i;});
  return {score,win,mvp:[win,mi],mvpS:dmgSum[win][mi]+' DMG',steps,stats:res};
}
const SIMS={f1:simF1,nba:simNBA,fifa:simFIFA,food:simFood,beer:simBeer,anime:simBattle,marvel:simBattle};
function playOther(g){
  const seed=(Math.random()*4294967296)>>>0,d=SIMS[g.game](g.rost,g.sub,seed);
  return {seed,score:d.score,win:d.win,mvp:d.mvp,mvpS:d.mvpS,pens:d.pens||null};
}

/* ================= match screen for the other games ================= */
function phText(ph){
  if(!ph)return '';
  switch(ph[0]){
    case 'lap':return ph[1]?T('lapN',ph[1],ph[2]):T('grid');
    case 'q':return `Q${ph[1]} ${String(Math.floor(ph[2]/60)).padStart(2,'0')}:${String(ph[2]%60).padStart(2,'0')}`;
    case 'ot':return `OT${ph[1]>1?ph[1]:''} ${String(Math.floor(ph[2]/60)).padStart(2,'0')}:${String(ph[2]%60).padStart(2,'0')}`;
    case 'clock3':return `${String(Math.floor(ph[1]/60)).padStart(2,'0')}:${String(ph[1]%60).padStart(2,'0')}`;
    case 'min':return ph[1]+"'";
    case 'pens':return T('pens');
    case 'course':return T('courseN',ph[1]);
    case 'fight':return T('fightN',ph[1]);
    case 'round':return T('roundN',ph[1]);
  }
  return '';
}
function evHtml(ev,g){
  const nm=([t,i])=>`<span class="${t?'tb':'ta'}">${esc(pName(P[g.rost[t][i]]))}</span>`;
  const dish=(t,k)=>g.rost[t][k]!=null?`<span class="${t?'tb':'ta'}">${esc(pName(P[g.rost[t][k]]))}</span>`:'—';
  switch(ev.e){
    case 'start':return `🚦 ${T('lightsOut')} ${nm(ev.a)} P1`;
    case 'pass':return `${nm(ev.a)} ${T('passes')} ${nm(ev.b)} → P${ev.pos}`;
    case 'pit':return `🔧 ${nm(ev.a)} ${T('pits')}`;
    case 'dnf':return `💥 ${nm(ev.a)} DNF`;
    case 'finish':return `🏁 ${nm(ev.a)} ${T('winsRace')}`;
    case 'ft':return ev.a?`${nm(ev.a)} FT ${ev.v}/2 <b class="num">+${ev.v}</b>`:T('fulltime');   // NBA free throw, or FIFA full time
    case 'shot':return `${nm(ev.a)} ${ev.out?(GM.sub==='3x3'?'2PT':'3PT'):(GM.sub==='3x3'?'1PT':'2PT')} <b class="num">+${ev.v}</b>`;
    case 'goal':return `⚽ ${nm(ev.a)}${ev.as?` <small>(${T('assist')} ${nm(ev.as)})</small>`:''}`;
    case 'save':return `🧤 ${nm(ev.a)} ${T('saves')} ${nm(ev.b)}`;
    case 'ht':return T('halftime');
    case 'pen':return `✅ ${nm(ev.a)} ${T('penScored')}`;case 'penx':return `❌ ${nm(ev.a)} ${T('penMissed')}`;
    case 'serve':return `🍽 ${dish(0,ev.k)} <i>vs</i> ${dish(1,ev.k)}`;
    case 'vote':return `${T('judgeN',ev.j)} → ${dish(ev.t,ev.k)} <span class="muted num">${ev.c[0]}:${ev.c[1]}</span>`;
    case 'course':return `🏆 ${dish(ev.w,ev.k)} ${T('winsCourse')}${ev.c?` <span class="muted num">${ev.c[0]}:${ev.c[1]}</span>`:''}`;
    case 'vs':return `⚔ ${dish(0,ev.k)} <i>vs</i> ${dish(1,ev.k)}`;

/* ================= bot ================= */
function botValue(g,t,id){
  const p=P[id],left=slotsLeft(g,t),money=g.money[t];
  if(left<=0||!canHold(g,t,id))return 0;
  const cur=g.rost[t].length?g.rost[t].reduce((a,i)=>a+P[i].hc,0)/g.rost[t].length:0,near=GK==='cs2'?4:GK==='beer'?8:2;
  const mates=GM.syn==='group'?g.rost[t].filter(i=>P[i].team===p.team).length:0;
  let v=Math.max(0,(p.hc-GM.val[0])*GM.val[1]);     // cs2: 0.95 → $0, 1.32 → $11.8
  if(mates)v+=[0,1.5,2.5,3,3][mates];               // same-team boost
  if(GK==='cs2'){
    if(isIGL(p)&&leaderOf(g.rost[t])==null)v+=2.5;   // first IGL lifts the whole team
    if(p.hc<UNDERDOG)v+=.8;                         // clutch underdog
  }else if(GK==='nba'&&!g.rost[t].some(i=>P[i].role===p.role))v+=1.2;
  else if(GK==='fifa'&&p.role==='GK'&&!g.rost[t].some(i=>P[i].role==='GK'))v+=4;
  else if(GK==='food'&&!g.rost[t].some(i=>P[i].cat===p.cat))v+=1;
  else if(GK==='beer'){if(!g.rost[t].some(i=>P[i].role===p.role))v+=.8;if(p.cc==='MN')v+=.6;}
  if(cur&&p.hc<cur-near)v*=.6;                         // would drag the average down
  v*=clamp((money/left)/4,.6,1.5);
  if(left===1)v=Math.max(v,money*(p.hc>=GM.rar[1]?1:p.hc>=GM.rar[3]?.6:.25));
  v+=(Math.random()*2-1)*({easy:3,mid:1.5,hard:.6}[g.diff]||1.5);
  const reserve=g.diff==='hard'?left-1:g.diff==='mid'?Math.floor((left-1)/2):0;
  return clamp(Math.round(v),0,Math.max(0,money-reserve));
}
function botMove(g,t){
  const acts=legalActs(g,t);if(!acts.length)return null;
  const W=botValue(g,t,g.cur),p=P[g.cur];
  if(g.phase==='offer'){
    if(g.kind==='normal'){
      if(W>=2||!acts.includes('give'))return ['take'];
      return (W<1||(GK==='cs2'&&p.hc<105))?['give']:['take'];
    }
    if(g.kind==='broke')return W>=1?['take']:['pass'];
  }
  if(g.phase==='bid'){
    if(W<=g.bid)return ['pass'];
    let step=(W-g.bid>=4&&Math.random()<.4)?2:1;
    return ['raise',Math.min(W,g.bid+step,g.money[t])];
  }
  return null;
}
function scheduleBot(){
  if(!G||G.mode!=='cpu'||G.actor!==1||(G.phase!=='offer'&&G.phase!=='bid'))return;
  const seq=G.seq,gid=G.gid,first=G.cardNo===1&&G.phase==='offer'?Math.max(0,G.startedAt+FLIP_MS-Date.now()):0;
  setTimeout(()=>{
    if(!G||G.gid!==gid||G.seq!==seq||G.actor!==1)return;
    const m=botMove(G,1);if(m&&act(G,1,m[0],m[1]))afterChange();
  },Math.max(first,(G.cardAt||0)+REVEAL_MS-Date.now())+650+Math.random()*900);
}

function startReel(stage,id,delay){

  const W=104,GAP=8,x=reel.clientWidth/2-(GAP+T*(W+GAP)+W/2)+(Math.random()*2-1)*W*.3;

async function detectTransport(){

  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const room=await Promise.race([window.claude.use('room'),new Promise(r=>setTimeout(()=>r(null),11000))]);
      if(room){NET.room=room;k='room';}

  }catch(e){k=null;}
  NET.kind=k;return k;
}
function wsTransport(code,onMsg,onStatus){
  let ws=null,closed=false,tries=0;
  function open(){
    try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+code);}catch(e){onStatus(false);return later();}
    ws.onopen=()=>{tries=0;onStatus(true);};
    ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}onMsg(d);};
    ws.onclose=()=>{onStatus(false);if(!closed)later();};

}

}

    case 'quit-yes':closeModal();if(G&&G.mode==='online')netLeave();else{G=null;go('home');}break;
    case 'skip':if(ANIM&&ANIM.skip)ANIM.skip();break;
    case 'again':again();break;
    case 'create-room':netOpen('host',rid(4,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'));break;
    case 'join-room':{const c=(($('#code')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(c.length!==4){toast(T('code4'));return;}UI.joinCode=c;netOpen('guest',c);break;}
    case 'ready':NET.ready=!NET.ready;sendReady();if(SCREEN==='lobby')render();else refreshAfter();break;
    case 'host-start':hostStart();break;
    case 'leave':if(G&&G.phase!=='match')quitModal();else netLeave();break;
    case 'copy':{const link=location.origin+location.pathname+'#room-'+NET.code;
      (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast(T('copied')),()=>toast(link));break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='bid')return;e.preventDefault();
  if(!G||G.phase!=='bid')return;
  const i=$('#bidv'),v=Math.floor(+i.value),min=G.bid+1,max=G.money[G.actor];
  if(!(v>=min&&v<=max)){toast(T('badBid',min,max));i.focus();return;}
  humanAct('raise',v);
});
document.addEventListener('input',e=>{
  if(e.target.id==='pname'){DB.last.p1=cleanName(e.target.value);saveDB();e.target.classList.remove('shake');}
  else if(e.target.id==='psearch')fillPlayers();
});

/* ================= loop & boot ================= */
setInterval(()=>{
  if(SCREEN==='draft'&&G&&G.phase!=='match'){
    updateTimer();
    if(isAuthority()&&stepClock(G))afterChange();
  }
  netTick();
  if(SCREEN==='lobby'&&NET.role==='guest'&&!NET.gotSt&&Date.now()-NET.openedAt>6000&&!NET.noHostShown){NET.noHostShown=true;render();}
},200);
(function boot(){
  document.documentElement.lang=LANG();
  const m=location.hash.match(/^#room-([A-Za-z0-9]{4})$/);
  useGame(DB.last.game||'cs2',DB.last['sub_'+(DB.last.game||'cs2')]);
  if(m&&myName()){UI.joinCode=m[1].toUpperCase();go('online');}else{if(m)UI.joinCode=m[1].toUpperCase();go('hub');}
  setTimeout(()=>{detectTransport();},0);
})();
</script>
</body>
