<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 $20 Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: an auction desk. Two wallets face each other (T side vs CT side), the player card sits on the block between them, the gavel is a 15-second ring. */
  --bg:#0d1117; --panel:#161d27; --raise:#1f2834; --line:#2a3646;
  --ink:#e9eef5; --muted:#8796ab;
  --t:#e8a33d;     /* team A = T side, also the accent */
  --ct:#5b9bf0;    /* team B = CT side */
  --led:#ffcf5a;
  --money:#4ad295; --loss:#f0606a;
  --display:"Exo 2","Arial Narrow",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ta{color:var(--t)} .tb{color:var(--ct)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 14px;border-radius:12px;font-weight:700;background:var(--t);color:#241502;font-size:16px;transition:transform .12s,filter .12s;text-align:center;line-height:1.15}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{background:var(--raise);color:var(--muted)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--panel)}
.btn.blue{background:var(--ct);color:#04172f}
.btn small{display:block;font-weight:500;font-size:11.5px;opacity:.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.icon:hover{background:var(--panel)}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:center;padding:6px}
.linkbtn:hover{color:var(--ink)}
.fine{font-size:12.5px;color:var(--muted);text-align:center}

/* home */
.brand{padding-top:18px}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--t)}
.brand h1{font-style:italic;font-size:clamp(54px,17vw,104px);line-height:.88;margin-top:12px;text-transform:uppercase}
.brand h1 .usd{color:var(--money);display:block}
.lede{color:var(--muted);margin-top:14px;max-width:36ch;font-size:16px}
.rec{background:var(--panel);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rec b{font:800 26px/1 var(--display)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);transition:border-color .15s,background .15s}
.mode:hover{border-color:var(--t);background:var(--raise)}
.mode b{font:800 21px/1.1 var(--display);font-style:italic;text-transform:uppercase}
.mode small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.mode .arr{font-size:22px;color:var(--t)}

/* forms */
.top{display:flex;align-items:center;gap:12px}
.top h2{font-size:22px;flex:1;text-transform:uppercase;font-style:italic}
.card{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;width:100%}
.field input:focus{border-color:var(--t);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:10px 4px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--t)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:24px!important;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.notice{border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:14px}

/* draft */
.dbar{display:flex;align-items:center;gap:10px}
.cardno{flex:1;font-size:13px;color:var(--muted)}
.cardno b{font:800 20px/1 var(--display);color:var(--ink)}
.timer{--p:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--t) calc(var(--p)*360deg),var(--raise) 0);flex:none}
.timer.b{background:conic-gradient(var(--ct) calc(var(--p)*360deg),var(--raise) 0)}
.timer span{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 17px/1 var(--display);font-variant-numeric:tabular-nums}
.timer.low{background:conic-gradient(var(--loss) calc(var(--p)*360deg),var(--raise) 0)}
.timer.low span{color:var(--loss)}
.timer.idle{opacity:.35}
.mgrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgr{background:var(--panel);border-radius:12px;padding:10px;border-top:3px solid var(--t);min-width:0;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s}
.mgr.b{border-top-color:var(--ct)}
.mgr.on{box-shadow:0 0 0 2px var(--t)}
.mgr.b.on{box-shadow:0 0 0 2px var(--ct)}
.mgr .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mgr .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mgr .cash{font:800 24px/1 var(--display);color:var(--money);font-variant-numeric:tabular-nums}
.mgr .cash.zero{color:var(--loss)}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.seats span{height:10px;border-radius:3px;background:var(--bg);border:1px dashed var(--line)}
.seats span.f{border:0;background:var(--t)}
.mgr.b .seats span.f{background:var(--ct)}
.mgr .who{font-size:12.5px;line-height:1.35;min-height:17px;overflow-wrap:anywhere}
.mgr .meta{font-size:11.5px;color:var(--muted)}
.block{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.pcard{position:relative;border-radius:18px;padding:18px 18px 16px;background:linear-gradient(135deg,#202a38 0%,#141a23 60%),var(--panel);border:1px solid #33425a;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;min-height:132px}
.pcard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.025) 22px 44px);pointer-events:none}
.pcard.fresh{animation:deal .45s cubic-bezier(.2,.8,.3,1)}
@keyframes deal{from{transform:translateY(16px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.ovr{grid-row:1/3;width:84px;height:84px;border-radius:14px;background:#0b0f15;border:1px solid #3a4a63;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:5px}
.ovr b{font:800 29px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.ovr small{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700;white-space:nowrap}
.pnick{display:flex;align-items:center;gap:10px;min-width:0}
.pnick span:last-child{min-width:0;overflow-wrap:anywhere}
.ava{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:end center;background:hsl(var(--h) 35% 22%);border:2px solid hsl(var(--h) 45% 45%)}
.ava svg{width:38px;height:38px;fill:hsl(var(--h) 30% 62%)}
.t1{color:var(--led)!important} .t2{color:var(--ink)} .t3{color:#b9c4d4} .t4{color:var(--loss)!important}
.ovr.t1b{border-color:rgba(255,207,90,.55);box-shadow:0 0 18px rgba(255,207,90,.18)}
.log .rt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pnick{font:800 clamp(30px,10vw,44px)/1 var(--display);font-style:italic;letter-spacing:-.01em;overflow-wrap:anywhere}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--raise);color:var(--ink)}
.chip.role-AWP,.chip.role-AWPIGL{background:rgba(255,207,90,.16);color:var(--led)}
.chip.role-IGL{background:rgba(74,210,149,.14);color:var(--money)}
.chip.role-Entry{background:rgba(240,96,106,.15);color:#ff8b92}
.chip.mn{background:#c4272f;color:#fff}
.hints{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hint{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.hint.good{border-color:rgba(74,210,149,.5);color:var(--money)}
.hint.bad{border-color:rgba(240,96,106,.5);color:var(--loss)}
.price{display:flex;align-items:center;justify-content:center;gap:12px;min-height:46px}
.price .amt{font:800 40px/1 var(--display);color:var(--money);font-variant-numeric:tabular-nums}
.price .by{font-size:14px;color:var(--muted)}
.status{font-size:15px;text-align:center;font-weight:600;min-height:22px}
.status.sub{font-weight:500;color:var(--muted);font-size:14px}
.acts{display:grid;gap:8px}
.acts.g2{grid-template-columns:1fr 1fr}
.acts.g3{grid-template-columns:repeat(3,1fr)}
.raise .btn{min-height:54px;font-size:19px;font-family:var(--display);font-weight:800}
.sold{text-align:center;padding:6px 0;font:800 24px/1.15 var(--display);font-style:italic;text-transform:uppercase}
.log{list-style:none;display:flex;flex-direction:column;gap:4px}
.log li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--panel);border-left:3px solid var(--t)}
.log li.b{border-left-color:var(--ct)}
.log li.skip{border-left-color:var(--line);color:var(--muted)}
.log .pr{font-weight:700;font-variant-numeric:tabular-nums}
.flip{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,8,12,.84);animation:fadeout .35s ease 1.3s forwards}
.flip div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px}
.coin{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a6,var(--led) 45%,#b07c0c);box-shadow:0 0 30px rgba(255,207,90,.45);animation:spin 1s cubic-bezier(.3,.7,.4,1)}
.flip h2{font-size:24px}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(1440deg)}}
@keyframes fadeout{to{opacity:0;visibility:hidden}}

/* match */
.board{border-radius:16px;padding:14px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background-color:#06090d;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:6px 6px;border:1px solid #1e2a3a}
.bteam{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bname{font:800 14px/1.1 var(--display);text-transform:uppercase;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{font-family:var(--display);font-weight:800;color:var(--led);text-shadow:0 0 14px rgba(255,207,90,.5),0 0 2px rgba(255,207,90,.9);font-variant-numeric:tabular-nums;font-size:clamp(46px,15vw,66px);line-height:1}
.led.dimmed{color:#6a5a2d;text-shadow:none}
.bmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.mapn{font:800 13px/1 var(--display);color:var(--muted);letter-spacing:.04em}
.colon{font:800 34px/1 var(--display);color:#3a4658}
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcol{background:var(--panel);border-radius:12px;padding:8px;border-top:3px solid var(--t);display:flex;flex-direction:column;gap:2px;min-width:0}
.rcol.b{border-top-color:var(--ct)}
.rrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:baseline;padding:7px 6px;border-radius:8px;font-size:14px;transition:opacity .25s,transform .25s}
.rrow+.rrow{border-top:1px solid var(--line)}
.rrow.hid{opacity:0;transform:translateY(6px)}
.rrow .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .n small{display:block;font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow b{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.rrow .st{font-style:normal;color:var(--led)}
.led.avg{font-size:clamp(28px,9vw,44px)}
.rsum{display:flex;justify-content:space-between;align-items:baseline;padding:8px 6px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rsum b{font:800 15px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.sb{width:100%;border-collapse:collapse;font-size:13px}
.sb th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;font-weight:700}
.sb th:first-child,.sb td:first-child{text-align:left}
.sb td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.sb td:first-child{font-weight:700;white-space:nowrap}
.sb tr.mvp td:first-child::after{content:" MVP";color:var(--led);font-size:10px;font-weight:800}
.sbwrap{background:var(--panel);border-radius:12px;padding:6px 6px 2px;border-left:3px solid var(--t)}
.sbwrap.b{border-left-color:var(--ct)}
.sbwrap h3{font-size:14px;padding:4px 6px;text-transform:uppercase}
.pos{color:var(--money)} .neg{color:var(--loss)}
.banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0}
.banner h2{font-size:clamp(28px,8vw,38px);line-height:1.05;text-transform:uppercase;font-style:italic}
.after{display:flex;flex-direction:column;gap:10px}
.stat{font-size:14px;color:var(--muted);text-align:center}

/* lobby */
.codebox{background:#06090d;border:1px solid #1e2a3a;border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:6px 6px}
.codebox .led{font-size:62px;letter-spacing:.14em}
.lseats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lseat{background:var(--panel);border-radius:12px;padding:12px;border-top:3px solid var(--t);display:flex;flex-direction:column;gap:4px;min-width:0}
.lseat.b{border-top-color:var(--ct)}
.lseat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--money);font-size:13px;font-weight:600}
.wait{color:var(--muted);font-size:13px}
.net{font-size:12.5px;color:var(--muted);text-align:center}
.net.bad{color:var(--loss)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,8,.74);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:24px;text-transform:uppercase;font-style:italic}
.sheet ol{padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#cfd8e6}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flip{display:none}}
</style>
</head>

/* ================= auction engine ================= */
const slotsLeft=(g,t)=>SLOTS-g.rost[t].length;
const canBid=(g,t)=>slotsLeft(g,t)>0&&g.money[t]>=1;
const openerOf=g=>((g.cardNo-1)%2)^g.first;
function newGame(mode,names,diff){
  const g={mode,gid:rid(8),names,diff:diff||'mid',first:Math.random()<.5?0:1,deck:shuffle(P.map(p=>p.id)),ptr:0,cur:null,cardNo:0,
    money:[BUDGET,BUDGET],rost:[[],[]],gives:[GIVES,GIVES],skips:[SKIPS,SKIPS],phase:'offer',kind:'normal',actor:0,bid:0,hi:-1,
    deadline:0,log:[],seq:0,res:null,sold:null,autoTo:-1,startedAt:Date.now()};
  nextCard(g,FLIP_MS);
  return g;
}
function nextCard(g,extra=0){
  g.seq++;g.sold=null;g.bid=0;g.hi=-1;g.cur=null;
  if((slotsLeft(g,0)===0&&slotsLeft(g,1)===0)||g.ptr>=g.deck.length){toMatch(g);return;}
  g.cur=g.deck[g.ptr++];g.cardNo++;
  const o=openerOf(g),x=1-o,now=Date.now(),bo=canBid(g,o),bx=canBid(g,x);
  g.deadline=now+TURN_MS+extra;
  if(bo&&bx){g.phase='offer';g.kind='normal';g.actor=o;}
  else if(bo||bx){const a=bo?o:x;g.phase='offer';g.actor=a;g.kind=slotsLeft(g,1-a)>0?'broke':'full';}
  else{g.phase='auto';g.autoTo=slotsLeft(g,o)>0?o:x;g.actor=-1;g.deadline=now+AUTO_MS+extra;}
}
function award(g,t,price,how){
  g.money[t]-=price;g.rost[t].push(g.cur);
  g.log.unshift({id:g.cur,t,price,how});g.log=g.log.slice(0,10);
  g.sold={id:g.cur,t,price,how};g.phase='sold';g.actor=-1;g.deadline=Date.now()+SOLD_MS;g.seq++;
}
function legalActs(g,t){
  if(g.actor!==t)return [];
  if(g.phase==='offer'){
    if(g.kind==='normal'){const a=['take'];if(g.gives[t]>0&&slotsLeft(g,1-t)>0)a.push('give');return a;}
    if(g.kind==='broke')return ['take','pass'];
    if(g.kind==='full')return g.skips[t]>0?['take','skip']:['take'];
  }
  if(g.phase==='bid')return ['raise','pass'];
  return [];
}
function act(g,t,a,v){
  if(!legalActs(g,t).includes(a))return false;
  const now=Date.now();
  if(g.phase==='offer'){
    if(a==='take'){
      if(g.kind==='normal'&&g.money[1-t]>=2){g.phase='bid';g.bid=1;g.hi=t;g.actor=1-t;g.deadline=now+TURN_MS;g.seq++;}
      else award(g,t,1,'bid');
    }else if(a==='give'){g.gives[t]--;award(g,1-t,0,'give');}
    else if(a==='pass')award(g,1-t,0,'zero');
    else if(a==='skip'){g.skips[t]--;const id=g.cur;g.log.unshift({id,t,price:0,how:'skip'});g.log=g.log.slice(0,10);g.cur=null;g.sold={id,t,price:0,how:'skip'};g.phase='sold';g.actor=-1;g.deadline=now+900;g.seq++;}
    return true;
  }
  if(g.phase==='bid'){
    if(a==='pass'){award(g,g.hi,g.bid,'bid');return true;}
    v=Math.floor(+v);
    if(!(v>g.bid&&v<=g.money[t]))return false;
    g.bid=v;g.hi=t;
    if(g.money[1-t]>v){g.actor=1-t;g.deadline=now+TURN_MS;g.seq++;}
    else award(g,t,v,'bid');
    return true;
  }
  return false;
}
/* automatic steps; returns true if state changed */
function stepClock(g){
  const now=Date.now();
  if(now<=g.deadline)return false;
  if(g.phase==='offer')return act(g,g.actor,'take');
  if(g.phase==='bid')return act(g,g.actor,'pass');
  if(g.phase==='sold'){nextCard(g);return true;}
  if(g.phase==='auto'){award(g,g.autoTo,0,'zero');return true;}
  return false;
}

/* ================= team strength (HLTV rating only) ================= */
// Strength = average HLTV Rating 3.0 of the 5 players. Kept in hundredths so ties are exact.
function teamSum(ids){return ids.reduce((a,i)=>a+P[i].hc,0);}
const avgTxt=sum=>(sum/SLOTS/100).toFixed(3);
function rosterAvg(ids){return ids.length?ids.reduce((a,i)=>a+P[i].hl,0)/ids.length:0;}
function playMatch(g){
  const S=[teamSum(g.rost[0]),teamSum(g.rost[1])];
  const win=S[0]===S[1]?-1:S[0]>S[1]?0:1;
  const best=[0,1].map(t=>{let b=0;g.rost[t].forEach((id,i)=>{if(P[id].hc>P[g.rost[t][b]].hc)b=i;});return b;});
  return {S,win,best};
}
function toMatch(g){g.phase='match';g.actor=-1;g.cur=null;g.res=playMatch(g);g.seq++;}

/* ================= bot ================= */
function botValue(g,t,id){
  const p=P[id],left=slotsLeft(g,t),money=g.money[t];
  if(left<=0)return 0;
  const cur=g.rost[t].length?teamSum(g.rost[t])/g.rost[t].length:0;
  let v=Math.max(0,(p.hc-95)*.32);                // 0.95 → $0, 1.15 → $6.4, 1.32 → $11.8
  if(cur&&p.hc<cur-4)v*=.6;                         // would drag the average down
  v*=clamp((money/left)/4,.6,1.5);
  if(left===1)v=Math.max(v,money*(p.hc>=115?1:p.hc>=108?.6:.25));
  v+=(Math.random()*2-1)*({easy:3,mid:1.5,hard:.6}[g.diff]||1.5);
  const reserve=g.diff==='hard'?left-1:g.diff==='mid'?Math.floor((left-1)/2):0;
  return clamp(Math.round(v),0,Math.max(0,money-reserve));
}
function botMove(g,t){
  const acts=legalActs(g,t);if(!acts.length)return null;
  const W=botValue(g,t,g.cur),p=P[g.cur];
  if(g.phase==='offer'){
    if(g.kind==='normal'){
      if(W>=2||!acts.includes('give'))return ['take'];
      return (W<1||p.hc<105)?['give']:['take'];
    }
    if(g.kind==='broke')return W>=1?['take']:['pass'];
    if(g.kind==='full')return (W>=1||!acts.includes('skip'))?['take']:['skip'];
  }
  if(g.phase==='bid'){
    if(W<=g.bid)return ['pass'];
    let step=(W-g.bid>=4&&Math.random()<.4)?2:1;
    return ['raise',Math.min(W,g.bid+step,g.money[t])];
  }
  return null;
}
function scheduleBot(){
  if(!G||G.mode!=='cpu'||G.actor!==1||(G.phase!=='offer'&&G.phase!=='bid'))return;
  const seq=G.seq,gid=G.gid,first=G.cardNo===1&&G.phase==='offer'?Math.max(0,G.startedAt+FLIP_MS-Date.now()):0;
  setTimeout(()=>{
    if(!G||G.gid!==gid||G.seq!==seq||G.actor!==1)return;
    const m=botMove(G,1);if(m&&act(G,1,m[0],m[1]))afterChange();
  },first+650+Math.random()*900);
}

const NET={kind:undefined,room:null,tr:null,role:null,code:'',name:'',team:0,opp:null,oppSeen:0,gr:false,ready:false,conn:false,lastSt:0,lastHi:0,lastReady:0,pending:null,full:false,gotSt:0,openedAt:0,noHostShown:false,oppOn:false};
async function detectTransport(){
  if(NET.kind!==undefined)return NET.kind;
  let k=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const room=await Promise.race([window.claude.use('room'),new Promise(r=>setTimeout(()=>r(null),11000))]);
      if(room){NET.room=room;k='room';}
    }else if(/^https?:$/.test(location.protocol))k='ws';
  }catch(e){k=null;}
  NET.kind=k;return k;
}
function wsTransport(code,onMsg,onStatus){
  let ws=null,closed=false,tries=0;
  function open(){
    try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+code);}catch(e){onStatus(false);return later();}
    ws.onopen=()=>{tries=0;onStatus(true);};
    ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}onMsg(d);};
    ws.onclose=()=>{onStatus(false);if(!closed)later();};
    ws.onerror=()=>{};
  }
  function later(){setTimeout(()=>{if(!closed)open();},Math.min(5000,700*(++tries)));}
  open();
  return {send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));},close(){closed=true;try{ws.close();}catch(e){}}};
}
async function roomTransport(code,onMsg,onStatus){
  const sub=await NET.room.join('cs2d-'+code.toLowerCase());
  const u1=sub.on('msg',m=>{if(m.sameTab)return;if(m.data&&typeof m.data==='object')onMsg(m.data);},()=>onStatus(false));
  const u2=sub.onConnection(c=>onStatus(!!c));
  return {send(o){sub.emit('msg',o).catch(()=>{});},close(){try{u1();u2();}catch(e){}sub.leave().catch(()=>{});}};
}
function renderOnlineSetup(){
  const n=DB.last.p1||'',k=NET.kind;let body;
  if(k===undefined){body=`<div class="notice">Холболт шалгаж байна…</div>`;detectTransport().then(()=>{if(SCREEN==='online')render();});}
  else if(k===null)body=`<div class="notice">Онлайн горим энэ хуудсан дээр ажиллахгүй байна. Тоглоомыг Cloudflare дээр байршуулсан хаягаар нээвэл найзтайгаа кодоор тоглоно.</div>`;
  else body=`<section class="card"><div class="field"><label for="nm1">Таны нэр</label><input id="nm1" maxlength="16" value="${esc(n)}" placeholder="Тоглогч 1" autocomplete="off"></div></section>
    <button class="btn" data-act="create-room">Өрөө үүсгэх</button>
    <div class="or">эсвэл кодоор нэгдэх</div>
    <section class="card"><div class="field"><label for="code">Өрөөний код</label><input id="code" class="code-in" maxlength="4" value="${esc(UI.joinCode)}" placeholder="ABCD" autocomplete="off" autocapitalize="characters"></div>
      <button class="btn ghost" data-act="join-room">Нэгдэх</button></section>`;
  $('#app').innerHTML=`<main class="wrap">${topBar('Онлайн')}${body}</main>`;
}
async function netOpen(role,code){
  const name=cleanName(($('#nm1')||{}).value)||'Тоглогч 1';DB.last.p1=name;saveDB();
  Object.assign(NET,{role,code,name,team:role==='host'?0:1,opp:null,oppSeen:0,gr:false,ready:false,conn:false,lastSt:0,lastHi:0,pending:null,full:false,gotSt:0,openedAt:Date.now(),noHostShown:false,oppOn:false});

  try{NET.tr=NET.kind==='room'?await roomTransport(code,netMsg,netStatus):wsTransport(code,netMsg,netStatus);}

function netStatus(c){const was=NET.conn;NET.conn=c;if(c&&!was){NET.lastHi=0;NET.lastSt=0;}refreshNet();}
function netLeave(){if(NET.tr)NET.tr.close();NET.tr=null;NET.role=null;G=null;go('home');}
function oppStatus(){
  if(!NET.tr)return '';if(!NET.conn)return '<span style="color:var(--loss)">· холболт тасарсан</span>';if(!NET.opp)return '';
  return Date.now()-NET.oppSeen<8000?'<span style="color:var(--money)">· ● онлайн</span>':'<span style="color:var(--loss)">· ● саатсан</span>';

const SYNC=['gid','first','deck','ptr','cur','cardNo','money','rost','gives','skips','phase','kind','actor','bid','hi','log','seq','res','sold','autoTo'];
function hostSnapshot(){
  let g=null;if(G){g={};SYNC.forEach(k=>g[k]=G[k]);g.rem=Math.max(0,G.deadline-Date.now());g.sa=Math.max(0,Date.now()-G.startedAt);}
  return {t:'st',v:1,pid:PID,code:NET.code,hn:NET.name,gn:NET.opp?NET.opp.name:'',gp:NET.opp?NET.opp.pid:'',gr:NET.gr,g};
}
function hostBroadcast(){if(NET.tr){NET.tr.send(hostSnapshot());NET.lastSt=Date.now();}}
function netMsg(d){
  if(!d||typeof d!=='object'||d.pid===PID)return;
  const now=Date.now();
  if(NET.role==='host'){
    if(NET.opp&&d.pid===NET.opp.pid)NET.oppSeen=now;
    if(d.t==='hi'&&d.role==='guest'){
      const free=!NET.opp||d.pid===NET.opp.pid||(now-NET.oppSeen>15000&&(!G||G.phase==='match'));
      if(!free)return;
      const fresh=!NET.opp||NET.opp.pid!==d.pid,nm=cleanName(d.name)||'Зочин',renamed=NET.opp&&NET.opp.name!==nm;
      NET.opp={pid:d.pid,name:nm};NET.oppSeen=now;if(fresh)NET.gr=false;
      if(fresh||renamed){if(G&&!fresh)G.names[1]=nm;hostBroadcast();refreshNet();}
    }else if(d.t==='ready'&&NET.opp&&d.pid===NET.opp.pid){
      if(NET.gr!==!!d.ready){NET.gr=!!d.ready;refreshNet();}hostBroadcast();
    }else if(d.t==='act'&&NET.opp&&d.pid===NET.opp.pid&&G&&d.gid===G.gid&&d.seq===G.seq&&G.actor===1){
      if(act(G,1,d.a,d.v))afterChange();else hostBroadcast();
    }
  }else if(NET.role==='guest'&&d.t==='st'&&d.code===NET.code)guestState(d);
}
function guestState(S){
  const now=Date.now();NET.gotSt=now;NET.oppSeen=now;
  const wasFull=NET.full;NET.full=!!(S.gp&&S.gp!==PID);
  if(NET.full){if(!wasFull)render();return;}
  const oppChanged=!NET.opp||NET.opp.name!==S.hn;
  NET.opp={pid:S.pid,name:cleanName(S.hn)||'Хост'};
  const grChanged=NET.gr!==!!S.gr;NET.gr=!!S.gr;
  const g=S.g;
  if(!g||(g.phase==='match'&&(!G||G.gid!==g.gid))){
    if(SCREEN!=='lobby'&&SCREEN!=='match'){G=null;go('lobby');}
    else if(SCREEN==='lobby'&&(oppChanged||grChanged||wasFull))render();
    else refreshNet();
    return;
  }
  const fresh=!G||G.gid!==g.gid,moved=fresh||G.seq!==g.seq;
  if(fresh){G={mode:'online',diff:'mid'};NET.ready=false;NET.pending=null;UI.lastCard=null;}
  SYNC.forEach(k=>G[k]=g[k]);
  G.names=[NET.opp.name,NET.name];G.deadline=now+(+g.rem||0);G.startedAt=now-(+g.sa||0);
  if(NET.pending&&(NET.pending.gid!==G.gid||NET.pending.seq!==G.seq))NET.pending=null;
  if(G.phase==='match'&&G.res){if(moved||SCREEN!=='match'){settle();go('match');}else refreshNet();}
  else if(moved||SCREEN!=='draft')go('draft');
  else{refreshNet();if(oppChanged)renderDraft();}
}
function sendHi(){if(NET.tr){NET.tr.send({t:'hi',role:NET.role,pid:PID,name:NET.name,code:NET.code});NET.lastHi=Date.now();}}
function sendReady(){if(NET.tr){NET.tr.send({t:'ready',pid:PID,ready:NET.ready,code:NET.code});NET.lastReady=Date.now();}}
function netTick(){
  if(!NET.tr)return;const now=Date.now();
  if(NET.role==='host'){if(now-NET.lastSt>2000)hostBroadcast();}
  else{
    if(now-NET.lastHi>3000)sendHi();
    if(NET.pending&&now-NET.pending.at>1200){const p=NET.pending;NET.tr.send({t:'act',pid:PID,gid:p.gid,seq:p.seq,a:p.a,v:p.v,code:NET.code});p.at=now;}

}

    const gReady=host?NET.gr:NET.ready;
    const seatB=guestName?`<b>${esc(guestName)}</b>${gReady?'<span class="ok">Бэлэн</span>':'<span class="wait">Бэлэн биш</span>'}`:'<b class="muted">Хүлээж байна…</b><span class="wait">Кодоо найздаа илгээ</span>';
    const btn=host?`<button class="btn" data-act="host-start" ${opp&&NET.gr?'':'disabled'}>Эхлүүлэх</button><p class="stat">${!opp?'Найз тань нэгдэхийг хүлээж байна…':NET.gr?'Бүгд бэлэн. Эхлүүлээрэй!':'Зочин «Бэлэн» дарахыг хүлээж байна…'}</p>`
      :`<button class="btn ${NET.ready?'ghost':''}" data-act="ready">${NET.ready?'Бэлэн биш болох':'Бэлэн'}</button><p class="stat">${NET.ready?'Хост эхлүүлэхийг хүлээж байна…':'Бэлэн болмогц хост тоглолтыг эхлүүлнэ'}</p>`;
    main=`<div class="lseats"><div class="lseat"><span class="lbl">Хост · T</span><b>${esc(hostName)}</b><span class="wait">${host?'Та':(oppOn?'● онлайн':'')}</span></div>
      <div class="lseat b"><span class="lbl">Зочин · CT</span>${seatB}</div></div>${btn}`;
  }
  $('#app').innerHTML=`<main class="wrap">${topBar('Онлайн өрөө','leave')}
    <div class="codebox"><span class="lbl">Өрөөний код</span><span class="led num">${esc(NET.code)}</span>
      ${host?`<span class="muted" style="font-size:13px;text-align:center">Найз тань «Онлайн → Нэгдэх» хэсэгт энэ кодыг оруулна</span>`:''}
      ${host&&link?`<button class="btn ghost" data-act="copy" style="min-height:40px;padding:8px 14px">Холбоос хуулах</button>`:''}</div>
    ${main}<p class="net ${NET.conn?'':'bad'}">${NET.conn?'Сервертэй холбогдсон':'Сервертэй холбогдож байна…'}</p></main>`;
}
function hostStart(){
  if(NET.role!=='host'||!NET.opp||!NET.gr)return;
  G=newGame('online',[NET.name,NET.opp.name]);NET.gr=false;UI.lastCard=null;
  hostBroadcast();go('draft');
}

/* ================= modals ================= */
function modal(html){$('#modal').innerHTML=`<div class="modal" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const b=$('#modal .sheet button');if(b)b.focus();}
function closeModal(){$('#modal').innerHTML='';}
function rulesModal(){
  modal(`<h2>$20 Draft-ын дүрэм</h2><ol>
    <li>Хоёулаа $20-той, 5 хоосон суудалтай эхэлнэ. Мөнгө нь виртуал.</li>
    <li>Тамирчдын карт санамсаргүй дарааллаар нэг нэгээр гарна. Карт бүрийг ээлжлэн нэг нь «нээнэ».</li>
    <li>Нээх ээлжтэй хүн картыг $1-ээр нээнэ, эсвэл өрсөлдөгчдөө үнэгүй өгнө. Өгөх эрх тоглолтод 2 удаа байна.</li>
    <li>Нээсний дараа нөгөө нь үнээ +$1, +$2, +$5 эсвэл бүх мөнгөөрөө өсгөнө. Өнжвөл хамгийн сүүлд үнэ хэлсэн нь авна. Байгаа мөнгөнөөсөө илүү хэлж болохгүй.</li>
    <li>Мөнгө дуусаад суудал үлдсэн бол үнэ хаялцаж чадахгүй. Өрсөлдөгч тань хүсээгүй картаа танд $0-оор өгнө.</li>
    <li>Нэг талын баг бүрдсэн бол нөгөө нь картыг $1-ээр авна, эсвэл алгасна. Алгасах эрх 3 удаа байна.</li>
    <li>Ээлж бүрт 15 секунд өгнө. Цаг дуусвал нээх үед $1-ээр авна, хаялцах үед өнжинө.</li>
    <li>Хоёр баг бүрдмэгц 5 тамирчны HLTV Rating 3.0-ийн дунджийг харьцуулна. Дундаж нь өндөр баг ялна. Яг тэнцвэл тэнцээ болно. Санамсаргүй зүйл, үүрэг (AWP, IGL), нэг багийн хослол огт тооцогдохгүй.</li>
  </ol>
  <p class="fine">Тамирчид: HLTV-ийн 2026.11.09-ний дэлхийн Top 20 баг, мөн BC.Game, 100 Thieves, TYLOO, Chinggis Warriors. Rating нь HLTV-ийн багийн хуудсан дээрх, тухайн багт тоглосон хугацааных (2026 оны 11-р сар).</p>
  <button class="btn" data-act="close">Ойлголоо</button>`);
}
function quitModal(){modal(`<h2>Тоглоомоос гарах уу?</h2><p class="muted">Энэ draft дуусахгүй, ялалт ялагдал бүртгэгдэхгүй.</p>
  <div class="row2"><button class="btn ghost" data-act="close">Үргэлжлүүлэх</button><button class="btn" data-act="quit-yes">Гарах</button></div>`);}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close-bg'){if(e.target===b)closeModal();return;}
  switch(a){
    case 'nav':go(b.dataset.to);break;
    case 'home':G=null;go('home');break;
    case 'rules':rulesModal();break;
    case 'close':closeModal();break;
    case 'diff':UI.diff=b.dataset.d;document.querySelectorAll('[data-act="diff"]').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'start-cpu':startCpu();break;
    case 'start-local':startLocal();break;
    case 'do':humanAct(b.dataset.a);break;
    case 'raise':humanAct('raise',+b.dataset.v);break;
    case 'quit':quitModal();break;
    case 'quit-yes':closeModal();if(G&&G.mode==='online')netLeave();else{G=null;go('home');}break;
    case 'skip':if(ANIM&&ANIM.skip)ANIM.skip();break;
    case 'again':again();break;
    case 'create-room':netOpen('host',rid(4,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'));break;
    case 'join-room':{const c=(($('#code')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(c.length!==4){toast('4 тэмдэгттэй код оруулна уу');return;}UI.joinCode=c;netOpen('guest',c);break;}
    case 'ready':NET.ready=!NET.ready;sendReady();if(SCREEN==='lobby')render();else refreshAfter();break;
    case 'host-start':hostStart();break;
    case 'leave':if(G&&G.phase!=='match')quitModal();else netLeave();break;
    case 'copy':{const link=location.origin+location.pathname+'#room-'+NET.code;
      (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Холбоос хуулагдлаа'),()=>toast(link));break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ================= loop & boot ================= */
setInterval(()=>{
  if(SCREEN==='draft'&&G&&G.phase!=='match'){
    updateTimer();
    if(isAuthority()&&stepClock(G))afterChange();
  }
  netTick();
  if(SCREEN==='lobby'&&NET.role==='guest'&&!NET.gotSt&&Date.now()-NET.openedAt>6000&&!NET.noHostShown){NET.noHostShown=true;render();}
},200);
(function boot(){
  const m=location.hash.match(/^#room-([A-Za-z0-9]{4})$/);
  if(m){UI.joinCode=m[1].toUpperCase();go('online');}else go('home');
  setTimeout(()=>{detectTransport();},0);
})();
</script>
</body>
</html>
