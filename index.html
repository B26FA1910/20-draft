<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 $20 Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Concept: a CS2 case opening. Every player is an "item" with a rarity colour taken from his HLTV rating,
     and each new card is revealed by a short case-opening reel. Everything around the card stays quiet. */
  --bg:#0E121B; --panel:#151B27; --raise:#1D2534; --line:#28324A;
  --ink:#EDF1F8; --muted:#8B97AD;
  --t:#F0A93E; --ct:#5A93F2;
  --money:#3FD38F; --loss:#FF5F6D;
  --r-ind:#5E98D9; --r-mil:#4B69FF; --r-res:#8847FF; --r-cla:#D32CE6; --r-cov:#EB4B4B; --r-gold:#E4AE39;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
.r-ind{--rc:var(--r-ind)} .r-mil{--rc:var(--r-mil)} .r-res{--rc:var(--r-res)} .r-cla{--rc:var(--r-cla)} .r-cov{--rc:var(--r-cov)} .r-gold{--rc:var(--r-gold)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{position:relative;z-index:1}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}
.wrap.enter{animation:enter .4s var(--out)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.12;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ta{color:var(--t)} .tb{color:var(--ct)}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.fine{font-size:12.5px;color:var(--muted);text-align:center;max-width:46ch;margin:0 auto}

/* whose turn: a soft glow from that player's corner */
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aura i{position:absolute;left:-20%;right:-20%;top:-10%;height:75vh;opacity:0;transition:opacity .7s ease}
.aura .a{background:radial-gradient(55% 50% at 18% 0%,rgba(240,169,62,.2),transparent 70%)}
.aura .b{background:radial-gradient(55% 50% at 82% 0%,rgba(90,147,242,.22),transparent 70%)}
.aura .n{background:radial-gradient(70% 55% at 50% 0%,rgba(136,71,255,.16),transparent 70%)}
body[data-side="0"] .aura .a,body[data-side="1"] .aura .b,body[data-side="n"] .aura .n{opacity:1}

/* buttons */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:10px 14px;border-radius:14px;font-weight:700;font-size:16px;line-height:1.15;text-align:center;background:var(--t);color:#2a1700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -10px rgba(240,169,62,.8);transition:transform .14s var(--out),filter .14s,box-shadow .2s}
.btn.blue{background:var(--ct);color:#03162f;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -10px rgba(90,147,242,.9)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:scale(.95)}
.btn:disabled{background:var(--raise);color:var(--muted);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.03);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.07)}
.btn small{font-weight:500;font-size:12px;opacity:.75}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.icon:hover{background:rgba(255,255,255,.09)}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:center;padding:8px}
.linkbtn:hover{color:var(--ink)}

/* avatar: neutral silhouette tinted by rarity */
.ava{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:end center;background:color-mix(in srgb,var(--rc,#8b97ad) 22%,#141a26);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc,#8b97ad) 70%,transparent)}
.ava svg{width:84%;height:84%;fill:color-mix(in srgb,var(--rc,#8b97ad) 45%,#d9e0ec)}
.ava.lg{width:72px;height:72px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 80%,transparent),0 0 0 6px color-mix(in srgb,var(--rc) 14%,transparent)}
.ava.sm{width:30px;height:30px}

/* mini item tile (home fan + reel) */
.mini{position:relative;flex:none;width:104px;height:140px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:10px 8px 14px;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 72%),linear-gradient(#1a2130,#121722);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 45%,transparent)}
.mini::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc)}
.mini .ava{width:46px;height:46px;margin-bottom:auto;margin-top:6px}
.mini b{font:700 11.5px/1.15 var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r{font:800 16px/1 var(--display);color:var(--rc)}
.mini.hitc{box-shadow:inset 0 0 0 2px var(--rc),0 0 24px color-mix(in srgb,var(--rc) 60%,transparent)}

/* home */
.hero{padding:10px 0 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.fan{position:relative;height:196px;width:100%}
.fan .mini{position:absolute;left:50%;top:14px;margin-left:-60px;width:120px;height:162px;transform:translate(var(--x),var(--y)) rotate(var(--rot));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 50%,transparent),0 18px 34px -14px rgba(0,0,0,.8);animation:fan 1s var(--out) both}
.fan .mini .ava{width:56px;height:56px}
.fan .mini:nth-child(1){--x:-100px;--y:14px;--rot:-11deg;animation-delay:.18s}
.fan .mini:nth-child(2){--x:0px;--y:0px;--rot:0deg;z-index:2;animation-delay:.05s}
.fan .mini:nth-child(3){--x:100px;--y:14px;--rot:11deg;animation-delay:.28s}
@keyframes fan{from{transform:translate(0,40px) rotate(0) scale(.86);opacity:0}}
.hero h1{font-size:clamp(34px,11vw,60px);font-weight:800;line-height:1}
.lede{color:#b8c2d4;max-width:34ch;font-size:15.5px}
.rec{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.recn{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.recn b{display:block;font:700 22px/1 var(--display);margin-bottom:3px;text-align:right}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,transform .15s var(--out),background .2s}
.mode:hover{background:var(--raise);box-shadow:inset 0 0 0 1px #3a4766}
.mode:active{transform:scale(.98)}
.mode b{font:700 16px/1.2 var(--display);display:block}
.mode small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--raise)}
.mi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode:nth-child(1) .mi{color:var(--r-cov)} .mode:nth-child(2) .mi{color:var(--t)} .mode:nth-child(3) .mi{color:var(--ct)}

/* forms */
.top{display:flex;align-items:center;gap:12px}
.top h2{font-size:19px;flex:1}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:13px 14px;font-size:16px;width:100%;transition:box-shadow .15s}
.field input:focus{box-shadow:inset 0 0 0 2px var(--t);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 4px;border-radius:9px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--t)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:24px!important;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.notice{box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:14px}

/* draft: top bar + timer */
.dbar{display:flex;align-items:center;gap:12px}
.cardno{flex:1;font-size:13px;color:var(--muted);line-height:1.2}
.cardno b{display:block;font:700 18px/1.1 var(--display);color:var(--ink)}
.timer{--p:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--t) calc(var(--p)*360deg),var(--raise) 0);flex:none;transition:transform .2s}
.timer.b{background:conic-gradient(var(--ct) calc(var(--p)*360deg),var(--raise) 0)}
.timer span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 16px/1 var(--display);font-variant-numeric:tabular-nums}
.timer.low{background:conic-gradient(var(--loss) calc(var(--p)*360deg),var(--raise) 0);animation:throb 1s ease-in-out infinite}
.timer.low span{color:var(--loss)}
.timer.idle{opacity:.3}
@keyframes throb{50%{transform:scale(1.08)}}

/* wallets */
.mgrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgr{position:relative;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .35s}
.mgr.on{box-shadow:inset 0 0 0 1.5px var(--t),0 12px 30px -16px var(--t)}
.mgr.b.on{box-shadow:inset 0 0 0 1.5px var(--ct),0 12px 30px -16px var(--ct)}
.mgr.hit{animation:hit .7s var(--out)}
@keyframes hit{25%{transform:scale(1.035)}}
.mgr .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mgr .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:6px}
.mgr .nm::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--t);opacity:.35}
.mgr.b .nm::before{background:var(--ct)}
.mgr.on .nm::before{opacity:1;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.mgr .cash{font:700 22px/1 var(--display);color:var(--money)}
.mgr .cash.zero{color:var(--loss)}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seats span{height:7px;border-radius:99px;background:rgba(255,255,255,.08)}
.seats span.f{background:var(--t)}
.mgr.b .seats span.f{background:var(--ct)}
.seats span.pop{animation:pop .6s var(--out)}
@keyframes pop{0%{transform:scale(.3,.3);filter:brightness(2)}55%{transform:scale(1.15,1.9)}}
.mgr .who{font-size:12.5px;line-height:1.35;min-height:17px;overflow-wrap:anywhere;color:#c5cede}
.mgr .meta{font-size:12px;color:var(--muted)}
.mgr .meta b{color:var(--ink);font-weight:600}

/* the card + case reel */
.block{position:relative;z-index:3;display:flex;flex-direction:column;gap:12px}
.block .block{z-index:auto}
.stage{position:relative;perspective:900px}
.pcard{position:relative;border-radius:22px;padding:16px 16px 20px;min-height:208px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;overflow:hidden;isolation:isolate;
  background:radial-gradient(85% 70% at 50% 0%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 72%),linear-gradient(180deg,#1a2131,#121722);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 50%,transparent),0 22px 44px -24px color-mix(in srgb,var(--rc) 75%,transparent)}
.pcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rc)}
.pcard::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.18) 50%,transparent 62%);transform:translateX(-130%)}
.pcard.land{animation:land .55s var(--out)}
.pcard.land::before{animation:sheen 1s .12s ease-out}
@keyframes land{from{transform:scale(.88) rotateX(14deg);opacity:0}}
@keyframes sheen{to{transform:translateX(130%)}}
.pc-rating{position:absolute;left:16px;top:14px;text-align:left;line-height:1}
.pc-rating b{display:block;font:800 30px/1 var(--display);color:var(--rc);letter-spacing:-.02em}
.pc-rating small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}
.pc-role{position:absolute;right:14px;top:14px}
.pc-nick{font:700 clamp(22px,7.4vw,32px)/1.08 var(--display);overflow-wrap:anywhere;max-width:100%;margin-top:4px}
.pc-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--raise);color:var(--ink)}
.chip.role-AWP,.chip.role-AWPIGL{background:rgba(228,174,57,.16);color:#f3c96b}
.chip.role-IGL{background:rgba(63,211,143,.14);color:var(--money)}
.chip.role-Entry{background:rgba(255,95,109,.15);color:#ff8b95}
.chip.mn{background:#c4272f;color:#fff}
.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:2px}
.hint{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted)}
.hint.good{background:rgba(63,211,143,.12);color:var(--money)}
.hint.bad{background:rgba(255,95,109,.12);color:var(--loss)}
.reel{position:absolute;inset:0;z-index:3;border-radius:22px;overflow:hidden;background:#0a0e16;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.stage.reeling .reel{opacity:1}
.stage.reeling .pcard{visibility:hidden}
.track{display:flex;gap:8px;padding-left:8px;will-change:transform}
.reel .marker{position:absolute;left:50%;top:10px;bottom:10px;width:2px;margin-left:-1px;background:var(--r-gold);box-shadow:0 0 14px var(--r-gold);z-index:2;border-radius:2px}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:56px;z-index:1;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#0a0e16,transparent)}
.reel::after{right:0;background:linear-gradient(-90deg,#0a0e16,transparent)}
.stamp{position:absolute;left:50%;top:40%;z-index:3;transform:translate(-50%,-50%) rotate(-9deg);font:800 26px/1 var(--display);padding:10px 18px;border-radius:14px;border:3px solid currentColor;background:rgba(10,14,22,.82);white-space:nowrap;animation:stamp .4s var(--out) both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-9deg) scale(2);opacity:0}}
.pcard.fly0{animation:fly0 .8s cubic-bezier(.5,0,.75,0) .5s both}
.pcard.fly1{animation:fly1 .8s cubic-bezier(.5,0,.75,0) .5s both}
@keyframes fly0{to{transform:translate(-28%,-105%) scale(.22) rotate(-10deg);opacity:0}}
@keyframes fly1{to{transform:translate(28%,-105%) scale(.22) rotate(10deg);opacity:0}}
.pcard.drop{animation:drop .6s ease-in .15s both}
@keyframes drop{to{transform:translateY(24px) scale(.94);opacity:0}}
.late{display:flex;flex-direction:column;gap:12px;animation:late .35s var(--out) var(--ld,0ms) both}
@keyframes late{from{opacity:0;visibility:hidden;transform:translateY(8px)}to{opacity:1;visibility:visible}}

/* bidding */
.price{display:flex;align-items:center;justify-content:center;gap:14px;min-height:50px}
.price .amt{font:800 44px/1 var(--display);color:var(--money);font-variant-numeric:tabular-nums;display:inline-block}
.price .amt.bump{animation:bump .45s var(--out)}
@keyframes bump{35%{transform:scale(1.28) translateY(-3px);color:#9ff5cd}}
.price .by{font-size:14px;color:var(--muted);line-height:1.3}
.status{font-size:15px;text-align:center;font-weight:600;min-height:22px}
.status.sub{font-weight:400;color:var(--muted);font-size:14px}
.acts{display:grid;gap:8px}
.acts.g2{grid-template-columns:1fr 1fr}
.acts.g3{grid-template-columns:repeat(3,1fr)}
.raise .btn{min-height:56px;font:700 17px/1.1 var(--display)}
.sold{text-align:center;padding:4px 0;font-size:16px;font-weight:600}
.log{list-style:none;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:13.5px;padding:8px 12px;border-radius:12px;background:var(--panel);box-shadow:inset 3px 0 0 var(--t)}
.log li.b{box-shadow:inset 3px 0 0 var(--ct)}
.log li.skip{box-shadow:inset 3px 0 0 var(--line);color:var(--muted)}
.log li.new{animation:slidein .45s var(--out)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
.log .rt{font:700 12px/1 var(--display);color:var(--rc);font-variant-numeric:tabular-nums}
.log .pr{font-weight:700;font-variant-numeric:tabular-nums}

/* coin toss for the first card */
.flip{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,9,14,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeout .35s ease 1.3s forwards}
.flip div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 20px}
.coin{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--t) 0 50%,var(--ct) 0 100%);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 40px rgba(136,71,255,.35);animation:spin 1s cubic-bezier(.3,.7,.4,1)}
.flip h2{font-size:21px}
@keyframes spin{from{transform:rotateY(0) scale(.6)}to{transform:rotateY(1440deg) scale(1)}}
@keyframes fadeout{to{opacity:0;visibility:hidden}}

/* result */
.board{border-radius:22px;padding:18px 12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;background:linear-gradient(180deg,#171e2c,#111622);box-shadow:inset 0 0 0 1px var(--line)}
.bteam{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bname{font-weight:600;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{font:800 clamp(24px,7.6vw,40px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:opacity .5s,transform .5s var(--out)}
#s0{color:var(--t)} #s1{color:var(--ct)}
.led.dimmed{opacity:.32}
.bteam.won .led{transform:scale(1.08);text-shadow:0 0 28px currentColor}
.bmid{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:4px}
.vs{font:700 14px/1 var(--display);color:var(--muted)}
.mapn{font-size:12px;color:var(--muted);white-space:nowrap}
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcol{background:var(--panel);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:inset 0 3px 0 var(--t),inset 0 0 0 1px var(--line)}
.rcol.b{box-shadow:inset 0 3px 0 var(--ct),inset 0 0 0 1px var(--line)}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 4px;font-size:14px;transition:opacity .35s,transform .45s var(--out)}
.rrow+.rrow{border-top:1px solid var(--line)}
.rrow.hid{opacity:0;transform:translateX(-14px)}
.rcol.b .rrow.hid{transform:translateX(14px)}
.rrow .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .n small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow b{font:700 15px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--rc)}
.rrow .st{font-style:normal;color:var(--r-gold)}
.rsum{display:flex;justify-content:space-between;align-items:baseline;padding:9px 4px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rsum b{font:700 14px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0}
.banner h2{font-size:clamp(26px,8vw,36px);line-height:1.05;animation:win .6s var(--out)}
@keyframes win{from{transform:scale(.7);opacity:0}}
.after{display:flex;flex-direction:column;gap:12px}
.stat{font-size:14px;color:var(--muted);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:34%;width:8px;height:13px;border-radius:2px;animation:conf var(--d) cubic-bezier(.2,.6,.35,1) var(--dl) both}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}35%{transform:translate(calc(var(--x)*.6),-18vh) rotate(calc(var(--r)*.4));opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* lobby */
.codebox{background:linear-gradient(180deg,#171e2c,#111622);box-shadow:inset 0 0 0 1px var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.codebox .led{font-size:52px;letter-spacing:.18em;padding-left:.18em;color:var(--ink)}
.lseats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lseat{background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:inset 0 3px 0 var(--t),inset 0 0 0 1px var(--line)}
.lseat.b{box-shadow:inset 0 3px 0 var(--ct),inset 0 0 0 1px var(--line)}
.lseat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--money);font-size:13px;font-weight:600}
.wait{color:var(--muted);font-size:13px}
.net{font-size:12.5px;color:var(--muted);text-align:center}
.net.bad{color:var(--loss)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,8,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line);animation:sheet .35s var(--out)}
@keyframes fadein{from{opacity:0}}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:21px}
.sheet ol{padding-left:20px;display:flex;flex-direction:column;gap:8px;color:#cfd8e6}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.3s var(--out);z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flip{display:none}.stage.reeling .pcard{visibility:visible}.stage.reeling .reel{display:none}}
</style>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= rules & data ================= */
const BUDGET=20,SLOTS=5,GIVES=2,SKIPS=3,TURN_MS=15000,FLIP_MS=1600,SOLD_MS=1400,AUTO_MS=1500,REVEAL_MS=1100;
// [nick, team, role, country, HLTV Rating 3.0 for the player's time on that team (hltv.org team pages, Nov 2026)]
// Teams: HLTV world ranking top 20 (9 Nov 2026) + BC.Game, 100 Thieves, TYLOO, Chinggis Warriors
const TEAMS=[
 ['Vitality',[['apEX','IGL','FR',1.00],['ZywOo','AWP','FR',1.32],['flameZ','Entry','IL',1.14],['mezii','Rifler','GB',1.06],['ropz','Rifler','EE',1.16]]],

 ['FURIA',[['yuurih','Rifler','BR',1.14],['KSCERATO','Rifler','BR',1.19],['FalleN','IGL','BR',0.97],['molodoy','AWP','KZ',1.15],['YEKINDAR','Entry','LV',1.09]]],
 ['Spirit',[['magixx','IGL','RU',1.05],['donk','Entry','RU',1.39],['zont1x','Rifler','UA',1.08],['sh1ro','AWP','RU',1.18],['tN1R','Rifler','BY',1.03]]],
 ['Aurora',[['Wicadia','Rifler','TR',1.12],['woxic','AWP','TR',1.05],['XANTARES','Entry','TR',1.12],['Jimpphat','Rifler','FI',1.12],['kyxsan','IGL','MK',0.94]]],
 ['Falcons',[['NiKo','Rifler','BA',1.13],['TeSeS','Rifler','DK',1.03],['m0NESY','AWP','RU',1.28],['kyousuke','Rifler','RU',1.15],['karrigan','IGL','DK',0.76]]],
 ['BetBoom',[['Boombl4','IGL','RU',0.97],['zorte','AWP','RU',1.02],['S1ren','Rifler','RU',1.06],['Magnojez','Rifler','RU',1.17],['d1Ledez','Rifler','RU',1.08]]],
 ['NAVI',[['b1t','Rifler','UA',1.12],['Aleksib','IGL','FI',0.93],['iM','Entry','RO',1.10],['w0nderful','AWP','UA',1.14],['makazze','Rifler','XK',1.11]]],
 ['FUT',[['dem0n','Rifler','UA',1.12],['dziugss','Rifler','LT',1.11],['Krabeni','IGL','XK',1.05],['xfl0ud','Rifler','TR',1.10],['SunPayus','AWP','ES',1.16]]],
 ['The MongolZ',[['bLitz','IGL','MN',1.08],['Techno','Rifler','MN',1.02],['910','AWP','MN',1.12],['cobrazera','Rifler','MN',1.02],['nin9','Rifler','MN',0.99]]],
 ['Nemiga',[['robo','IGL','RU',1.01],['KaiR0N-','Rifler','RU',1.11],['syph0','Rifler','KZ',1.17],['khaN','Rifler','KZ',1.08],['Xant3r','Rifler','RU',1.07]]],
 ['G2',[['huNter-','IGL','BA',1.09],['HeavyGod','Rifler','IL',1.14],['MATYS','Rifler','SK',1.07],['NertZ','Rifler','IL',1.09],['r1nkle','AWP','UA',0.95]]],
 ['PARIVISION',[['Jame','AWP/IGL','RU',1.13],['xiELO','Rifler','RU',1.06],['zweih','Rifler','RU',1.05],['FL1T','Rifler','RU',0.98],['HObbit','Rifler','KZ',0.94]]],
 ['Legacy',[['arT','IGL','BR',0.91],['dumau','AWP','BR',1.19],['latto','Rifler','BR',1.18],['try','Rifler','AR',1.10],['ksloks','Rifler','BR',0.84]]],
 ['1win',[['nafany','IGL','RU',0.96],['Ax1Le','Rifler','RU',1.16],['ArtFr0st','AWP','RU',1.10],['fame','Rifler','RU',1.06],['BELCHONOKK','Rifler','RU',1.02]]],
 ['MIBR',[['LNZ','IGL','SE',0.99],['insani','Rifler','BR',1.21],['venomzera','Rifler','BR',1.07],['nqz','AWP','BR',1.06],['tomaszin','Rifler','AR',1.01]]],
 ['Liquid',[['NAF','Rifler','CA',1.14],['EliGE','Rifler','US',1.10],['malbsMd','Rifler','GT',1.08],['JT','IGL','ZA',0.95],['Jorko','AWP','BG',1.04]]],
 ['FaZe',[['Twistzz','IGL','CA',1.15],['frozen','Rifler','SK',1.16],['jcobbb','Rifler','PL',1.00],['Neityu','Rifler','FR',0.94],['JBOEN','AWP','DK',1.10]]],
 ['9z',[['max','IGL','UY',1.06],['dgt','Rifler','UY',1.14],['luchov','Rifler','AR',1.14],['HUASOPEEK','Entry','CL',1.10],['history','Rifler','BR',1.14]]],
 ['Astralis',[['siuhy','IGL','PL',0.89],['phzy','AWP','SE',1.07],['Staehr','Rifler','DK',1.10],['ryu','Rifler','LT',1.08],['cmtry','Rifler','UA',0.95]]],
 ['BC.Game',[['s1mple','AWP','UA',1.18],['Senzu','Rifler','MN',1.20],['mzinho','Rifler','MN',1.08],['Magisk','IGL','DK',1.00],['asap','Rifler','AU',0.98]]],
 ['100 Thieves',[['Gizmy','IGL','GB',1.01],['device','AWP','DK',1.14],['rain','Rifler','NO',1.06],['poiii','Rifler','SE',1.15],['sirah','Rifler','DK',1.08]]],
 ['TYLOO',[['Mercury','IGL','CN',1.08],['Jee','AWP','CN',1.11],['JamYoung','Rifler','CN',1.21],['Moseyuh','Rifler','CN',1.10],['Zero','Rifler','CN',1.07]]],
 ['Chinggis Warriors',[['ROUX','Rifler','MN',1.06],['sk0R','Rifler','MN',1.14],['fury5k','Rifler','MN',0.98],['tikuak','Rifler','MN',1.17],['cool4st','Rifler','MN',1.03]]]];
const P=[];TEAMS.forEach(([team,ps],ti)=>ps.forEach(a=>P.push({id:P.length,nick:a[0],team,trank:ti+1,role:a[1],cc:a[2],hl:a[3],hc:Math.round(a[3]*100)})));
// rarity colour from rating (CS2 item grades)
const rarOf=hc=>hc>=125?'gold':hc>=115?'cov':hc>=110?'cla':hc>=105?'res':hc>=100?'mil':'ind';
// neutral placeholder avatar (no real photos): silhouette tinted by rarity
const avatar=(p,size='')=>`<span class="ava ${size}" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7.5"/><path d="M5 40c1.5-9 7.5-14 15-14s13.5 5 15 14z"/></svg></span>`;
const miniCard=p=>`<div class="mini r-${rarOf(p.hc)}">${avatar(p)}<b>${esc(p.nick)}</b><span class="r num">${fmtR(p.hl)}</span></div>`;
const fmtR=x=>(+x).toFixed(2);
const DIFF={easy:'Хялбар',mid:'Дунд',hard:'Хэцүү'};

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=(n,abc='abcdefghijkmnpqrstuvwxyz23456789')=>{let s='';for(let i=0;i<n;i++)s+=abc[Math.floor(Math.random()*abc.length)];return s;};
const r1=x=>Math.round(x*10)/10;
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= storage ================= */
const KEY='cs2d20.v1';let MEM={};
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return MEM;}}
function saveDB(){MEM=DB;try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
const DB=loadDB();DB.rec=DB.rec||{};DB.last=DB.last||{};
const recOf=n=>DB.rec[n]||{w:0,l:0};
function record(n,r){const x=DB.rec[n]||(DB.rec[n]={w:0,l:0});x[r]=(x[r]||0)+1;saveDB();}
function ssGet(k,d){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ssSet(k,v){try{sessionStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const PID=ssGet('cs2d.pid',null)||rid(10);ssSet('cs2d.pid',PID);
const SETTLED=new Set(ssGet('cs2d.settled',[]));
function markSettled(g){SETTLED.add(g);ssSet('cs2d.settled',[...SETTLED].slice(-40));}

/* ================= auction engine ================= */
const slotsLeft=(g,t)=>SLOTS-g.rost[t].length;
const canBid=(g,t)=>slotsLeft(g,t)>0&&g.money[t]>=1;
const openerOf=g=>((g.cardNo-1)%2)^g.first;
function newGame(mode,names,diff){
  const g={mode,gid:rid(8),names,diff:diff||'mid',first:Math.random()<.5?0:1,deck:shuffle(P.map(p=>p.id)),ptr:0,cur:null,cardNo:0,
    money:[BUDGET,BUDGET],rost:[[],[]],gives:[GIVES,GIVES],skips:[SKIPS,SKIPS],phase:'offer',kind:'normal',actor:0,bid:0,hi:-1,
    deadline:0,log:[],seq:0,res:null,sold:null,autoTo:-1,startedAt:Date.now()};
  nextCard(g,FLIP_MS);
  return g;
}
function nextCard(g,extra=0){
  g.seq++;g.sold=null;g.bid=0;g.hi=-1;g.cur=null;
  if((slotsLeft(g,0)===0&&slotsLeft(g,1)===0)||g.ptr>=g.deck.length){toMatch(g);return;}
  g.cur=g.deck[g.ptr++];g.cardNo++;
  const o=openerOf(g),x=1-o,now=Date.now(),bo=canBid(g,o),bx=canBid(g,x);
  g.deadline=now+TURN_MS+extra+REVEAL_MS;g.cardAt=now+extra;
  if(bo&&bx){g.phase='offer';g.kind='normal';g.actor=o;}
  else if(bo||bx){const a=bo?o:x;g.phase='offer';g.actor=a;g.kind=slotsLeft(g,1-a)>0?'broke':'full';}
  else{g.phase='auto';g.autoTo=slotsLeft(g,o)>0?o:x;g.actor=-1;g.deadline=now+AUTO_MS+extra+REVEAL_MS;}
}
function award(g,t,price,how){
  g.money[t]-=price;g.rost[t].push(g.cur);
  g.log.unshift({id:g.cur,t,price,how});g.log=g.log.slice(0,10);
  g.sold={id:g.cur,t,price,how};g.phase='sold';g.actor=-1;g.deadline=Date.now()+SOLD_MS;g.seq++;
}
function legalActs(g,t){
  if(g.actor!==t)return [];
  if(g.phase==='offer'){
    if(g.kind==='normal'){const a=['take'];if(g.gives[t]>0&&slotsLeft(g,1-t)>0)a.push('give');return a;}
    if(g.kind==='broke')return ['take','pass'];
    if(g.kind==='full')return g.skips[t]>0?['take','skip']:['take'];
  }
  if(g.phase==='bid')return ['raise','pass'];
  return [];
}
function act(g,t,a,v){
  if(!legalActs(g,t).includes(a))return false;
  const now=Date.now();
  if(g.phase==='offer'){
    if(a==='take'){
      if(g.kind==='normal'&&g.money[1-t]>=2){g.phase='bid';g.bid=1;g.hi=t;g.actor=1-t;g.deadline=now+TURN_MS;g.seq++;}
      else award(g,t,1,'bid');
    }else if(a==='give'){g.gives[t]--;award(g,1-t,0,'give');}
    else if(a==='pass')award(g,1-t,0,'zero');
    else if(a==='skip'){g.skips[t]--;const id=g.cur;g.log.unshift({id,t,price:0,how:'skip'});g.log=g.log.slice(0,10);g.cur=null;g.sold={id,t,price:0,how:'skip'};g.phase='sold';g.actor=-1;g.deadline=now+900;g.seq++;}
    return true;
  }
  if(g.phase==='bid'){
    if(a==='pass'){award(g,g.hi,g.bid,'bid');return true;}
    v=Math.floor(+v);
    if(!(v>g.bid&&v<=g.money[t]))return false;
    g.bid=v;g.hi=t;
    if(g.money[1-t]>v){g.actor=1-t;g.deadline=now+TURN_MS;g.seq++;}
    else award(g,t,v,'bid');
    return true;
  }
  return false;
}
/* automatic steps; returns true if state changed */
function stepClock(g){
  const now=Date.now();
  if(now<=g.deadline)return false;
  if(g.phase==='offer')return act(g,g.actor,'take');
  if(g.phase==='bid')return act(g,g.actor,'pass');
  if(g.phase==='sold'){nextCard(g);return true;}
  if(g.phase==='auto'){award(g,g.autoTo,0,'zero');return true;}
  return false;
}

/* ================= team strength (HLTV rating only) ================= */
// Strength = average HLTV Rating 3.0 of the 5 players. Kept in hundredths so ties are exact.
function teamSum(ids){return ids.reduce((a,i)=>a+P[i].hc,0);}
const avgTxt=sum=>(sum/SLOTS/100).toFixed(3);
function rosterAvg(ids){return ids.length?ids.reduce((a,i)=>a+P[i].hl,0)/ids.length:0;}
function playMatch(g){
  const S=[teamSum(g.rost[0]),teamSum(g.rost[1])];
  const win=S[0]===S[1]?-1:S[0]>S[1]?0:1;
  const best=[0,1].map(t=>{let b=0;g.rost[t].forEach((id,i)=>{if(P[id].hc>P[g.rost[t][b]].hc)b=i;});return b;});
  return {S,win,best};
}
function toMatch(g){g.phase='match';g.actor=-1;g.cur=null;g.res=playMatch(g);g.seq++;}

/* ================= bot ================= */
function botValue(g,t,id){
  const p=P[id],left=slotsLeft(g,t),money=g.money[t];
  if(left<=0)return 0;
  const cur=g.rost[t].length?teamSum(g.rost[t])/g.rost[t].length:0;
  let v=Math.max(0,(p.hc-95)*.32);                // 0.95 → $0, 1.15 → $6.4, 1.32 → $11.8
  if(cur&&p.hc<cur-4)v*=.6;                         // would drag the average down
  v*=clamp((money/left)/4,.6,1.5);
  if(left===1)v=Math.max(v,money*(p.hc>=115?1:p.hc>=108?.6:.25));
  v+=(Math.random()*2-1)*({easy:3,mid:1.5,hard:.6}[g.diff]||1.5);
  const reserve=g.diff==='hard'?left-1:g.diff==='mid'?Math.floor((left-1)/2):0;
  return clamp(Math.round(v),0,Math.max(0,money-reserve));
}
function botMove(g,t){
  const acts=legalActs(g,t);if(!acts.length)return null;
  const W=botValue(g,t,g.cur),p=P[g.cur];
  if(g.phase==='offer'){
    if(g.kind==='normal'){
      if(W>=2||!acts.includes('give'))return ['take'];
      return (W<1||p.hc<105)?['give']:['take'];
    }
    if(g.kind==='broke')return W>=1?['take']:['pass'];
    if(g.kind==='full')return (W>=1||!acts.includes('skip'))?['take']:['skip'];
  }
  if(g.phase==='bid'){
    if(W<=g.bid)return ['pass'];
    let step=(W-g.bid>=4&&Math.random()<.4)?2:1;
    return ['raise',Math.min(W,g.bid+step,g.money[t])];
  }
  return null;
}
function scheduleBot(){
  if(!G||G.mode!=='cpu'||G.actor!==1||(G.phase!=='offer'&&G.phase!=='bid'))return;
  const seq=G.seq,gid=G.gid,first=G.cardNo===1&&G.phase==='offer'?Math.max(0,G.startedAt+FLIP_MS-Date.now()):0;
  setTimeout(()=>{
    if(!G||G.gid!==gid||G.seq!==seq||G.actor!==1)return;
    const m=botMove(G,1);if(m&&act(G,1,m[0],m[1]))afterChange();
  },Math.max(first,(G.cardAt||0)+REVEAL_MS-Date.now())+650+Math.random()*900);
}

/* ================= app state ================= */
let SCREEN='home',G=null,ANIM=null;
const UI={diff:DB.last.diff||'mid',joinCode:'',lastCard:null,animGid:null};
function go(s){SCREEN=s;render();}
function render(){
  if(ANIM&&SCREEN!=='match'){cancelAnimationFrame(ANIM.raf);clearTimeout(ANIM.to);ANIM=null;}
  if(SCREEN!=='draft')document.body.dataset.side=SCREEN==='match'?'n':'';
  ({home:renderHome,cpu:renderCpuSetup,local:renderLocalSetup,online:renderOnlineSetup,lobby:renderLobby,draft:renderDraft,match:renderMatch})[SCREEN]();
  if(UI.lastScreen!==SCREEN){UI.lastScreen=SCREEN;const w=$('#app .wrap');if(w&&!reduceMotion())w.classList.add('enter');}
}
function tickNum(el,from,to,ms,fmt){
  if(!el)return;if(reduceMotion()||from===to){el.textContent=fmt(to);return;}
  const t0=performance.now();
  (function f(now){const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1&&el.isConnected)requestAnimationFrame(f);})(t0);
}
const isAuthority=()=>!G||G.mode!=='online'||NET.role==='host';
function controls(t){if(!G||t<0)return false;if(G.mode==='cpu')return t===0;if(G.mode==='local')return true;return t===NET.team;}
function myTeam(){return !G?0:G.mode==='cpu'?0:G.mode==='online'?NET.team:(G.actor>=0?G.actor:0);}
function afterChange(){
  if(G.mode==='online'&&NET.role==='host')hostBroadcast();
  if(G.phase==='match'){settle();go('match');return;}
  renderDraft();scheduleBot();
}

/* ================= home & setup ================= */
function renderHome(){

function startReel(stage,id,delay){
  if(!stage)return;
  const reel=stage.querySelector('.reel'),track=stage.querySelector('.track'),card=stage.querySelector('.pcard');
  const T=20,pool=P.filter(p=>p.id!==id),ids=[];
  for(let i=0;i<T+4;i++)ids.push(i===T?id:pool[Math.floor(Math.random()*pool.length)].id);
  track.innerHTML=ids.map(i=>miniCard(P[i])).join('');
  const W=104,GAP=8,x=reel.clientWidth/2-(GAP+T*(W+GAP)+W/2)+(Math.random()*2-1)*W*.3;
  const done=()=>{if(!stage.isConnected)return;track.children[T].classList.add('hitc');
    setTimeout(()=>{if(!stage.isConnected)return;stage.classList.remove('reeling');card.classList.add('land');},140);};
  if(!track.animate){done();return;}
  const an=track.animate([{transform:'translateX(0)'},{transform:`translateX(${x}px)`}],{duration:REVEAL_MS-220,delay,easing:'cubic-bezier(.1,.6,.13,1)',fill:'forwards'});
  an.onfinish=done;
}

}

function renderMatch(){
  if(ANIM){clearTimeout(ANIM.to);ANIM=null;}
  const g=G,res=g.res;
  const col=t=>`<section class="rcol ${t?'b':''}">${sortedRost(t).map((r,k)=>{const p=P[r.id];

  $('#app').innerHTML=`<main class="wrap">
    <div class="top"><button class="icon" data-act="${g.mode==='online'?'leave':'home'}" aria-label="Гарах">×</button><h2>Үр дүн</h2><button class="linkbtn" data-act="skip" id="skipbtn">Алгасах</button></div>

      <div class="bteam" id="bt1"><span class="bname tb">${esc(g.names[1])}</span><span class="led num" id="s1">0.000</span></div>
    </div>
    <div class="rcols">${col(0)}${col(1)}</div>
    <div id="after" class="after"></div>
  </main>`;
  const instant=reduceMotion()||UI.animGid===g.gid;UI.animGid=g.gid;
  // reveal from the weakest pick up to the strongest, alternating sides
  const order=[];for(let k=SLOTS-1;k>=0;k--)[0,1].forEach(t=>{if(k<g.rost[t].length)order.push([t,k]);});
  const sum=[0,0],cnt=[0,0];let i=0;
  function show(t,k){
    const row=document.querySelector(`.rrow[data-t="${t}"][data-k="${k}"]`);if(!row)return;
    row.classList.remove('hid');const from=sum[t];sum[t]+=P[sortedRost(t)[k].id].hc;cnt[t]++;
    $('#sum'+t).textContent=(sum[t]/100).toFixed(2);
    const el=$('#s'+t),a=from&&cnt[t]>1?from/(cnt[t]-1):sum[t],b=sum[t]/cnt[t];

  ANIM={raf:0,to:setTimeout(step,instant?0:700),skip:()=>{clearTimeout(ANIM.to);instantAll();}};
  if(instant){clearTimeout(ANIM.to);instantAll();}
}
let finished=null;
function finishMatch(){
  const g=G,res=g.res;

  [0,1].forEach(t=>{$('#s'+t).textContent=avgTxt(res.S[t]);$('#sum'+t).textContent=(res.S[t]/100).toFixed(2);});
  const h=$('#half');h.textContent='Эцсийн дүн';h.dataset.done='1';
  if(res.win>=0){$('#s'+(1-res.win)).classList.add('dimmed');$('#bt'+res.win).classList.add('won');}
  const sb=$('#skipbtn');if(sb)sb.remove();
  const me=g.mode==='cpu'?0:g.mode==='online'?NET.team:res.win;
  if(res.win>=0&&res.win===me&&UI.confGid!==g.gid){UI.confGid=g.gid;confetti();}

function confetti(){
  if(reduceMotion())return;
  const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  const cols=['#4B69FF','#8847FF','#D32CE6','#EB4B4B','#E4AE39','#3FD38F','#F0A93E','#5A93F2'];
  for(let i=0;i<70;i++){const c=document.createElement('i');
    c.style.cssText=`left:${42+Math.random()*16}%;background:${cols[i%cols.length]};--x:${((Math.random()*2-1)*50).toFixed(1)}vw;--y:${(55+Math.random()*45).toFixed(1)}vh;--r:${Math.round(Math.random()*900-450)}deg;--d:${(1.4+Math.random()*1.1).toFixed(2)}s;--dl:${(Math.random()*.18).toFixed(2)}s`;
    box.appendChild(c);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3000);
}
function refreshAfter(){
  const el=$('#after');if(!el||!G||!G.res||!$('#half')||!$('#half').dataset.done)return;
  const g=G,res=g.res,w=res.win;
  const diff=Math.abs(res.S[0]-res.S[1])/SLOTS/100;
  let head;
  if(w<0)head='Тэнцлээ!';
  else if(g.mode==='local')head=`Ялагч: ${nameC(w)}`;
  else{const me=g.mode==='cpu'?0:NET.team;head=w===me?'Та яллаа!':`${esc(g.names[w])} яллаа`;}
  const star=w>=0?P[g.rost[w][res.best[w]]]:null;
  let acts='';
  if(g.mode!=='online')acts=`<div class="row2"><button class="btn" data-act="again">Дахин тоглох</button><button class="btn ghost" data-act="home">Нүүр</button></div>`;
  else if(NET.role==='host'){const ok=NET.opp&&NET.gr;
    acts=`<p class="stat">${!NET.opp?'Өрсөлдөгч гарсан байна':ok?`${esc(NET.opp.name)} дахин тоглоход бэлэн`:`${esc(NET.opp.name)} бэлэн болохыг хүлээж байна…`}</p>
      <div class="row2"><button class="btn" data-act="host-start" ${ok?'':'disabled'}>Дахин эхлүүлэх</button><button class="btn ghost" data-act="leave">Гарах</button></div>`;}
  else acts=`<p class="stat">${NET.ready?'Хост эхлүүлэхийг хүлээж байна…':'Дахин тоглох уу?'}</p>
      <div class="row2"><button class="btn ${NET.ready?'ghost':''}" data-act="ready">${NET.ready?'Бэлэн биш':'Бэлэн'}</button><button class="btn ghost" data-act="leave">Гарах</button></div>`;
  el.innerHTML=`<div class="banner"><h2>${head}</h2><span class="muted num">${avgTxt(res.S[0])} ба ${avgTxt(res.S[1])}${w>=0?`, зөрүү ${diff.toFixed(3)}`:''}</span></div>
    ${star?`<p class="stat">Ялагч багийн хамгийн өндөр rating: <b style="color:var(--led)">${esc(star.nick)} ${fmtR(star.hl)}</b></p>`:''}

function again(){
  const [a,b]=G.names;
  G=G.mode==='cpu'?newGame('cpu',[a,'Компьютер'],G.diff):newGame('local',[a,b]);
  UI.lastCard=null;go('draft');scheduleBot();
}

/* ================= online ================= */
const NET={kind:undefined,room:null,tr:null,role:null,code:'',name:'',team:0,opp:null,oppSeen:0,gr:false,ready:false,conn:false,lastSt:0,lastHi:0,lastReady:0,pending:null,full:false,gotSt:0,openedAt:0,noHostShown:false,oppOn:false};
async function detectTransport(){
  if(NET.kind!==undefined)return NET.kind;
  let k=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const room=await Promise.race([window.claude.use('room'),new Promise(r=>setTimeout(()=>r(null),11000))]);
      if(room){NET.room=room;k='room';}
    }else if(/^https?:$/.test(location.protocol))k='ws';
  }catch(e){k=null;}
  NET.kind=k;return k;
}
function wsTransport(code,onMsg,onStatus){
  let ws=null,closed=false,tries=0;
  function open(){
    try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+code);}catch(e){onStatus(false);return later();}
    ws.onopen=()=>{tries=0;onStatus(true);};
    ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}onMsg(d);};
    ws.onclose=()=>{onStatus(false);if(!closed)later();};
    ws.onerror=()=>{};
  }
  function later(){setTimeout(()=>{if(!closed)open();},Math.min(5000,700*(++tries)));}
  open();
  return {send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));},close(){closed=true;try{ws.close();}catch(e){}}};
}
async function roomTransport(code,onMsg,onStatus){
  const sub=await NET.room.join('cs2d-'+code.toLowerCase());
  const u1=sub.on('msg',m=>{if(m.sameTab)return;if(m.data&&typeof m.data==='object')onMsg(m.data);},()=>onStatus(false));
  const u2=sub.onConnection(c=>onStatus(!!c));
  return {send(o){sub.emit('msg',o).catch(()=>{});},close(){try{u1();u2();}catch(e){}sub.leave().catch(()=>{});}};
}
function renderOnlineSetup(){
  const n=DB.last.p1||'',k=NET.kind;let body;
  if(k===undefined){body=`<div class="notice">Холболт шалгаж байна…</div>`;detectTransport().then(()=>{if(SCREEN==='online')render();});}
  else if(k===null)body=`<div class="notice">Онлайн горим энэ хуудсан дээр ажиллахгүй байна. Тоглоомыг Cloudflare дээр байршуулсан хаягаар нээвэл найзтайгаа кодоор тоглоно.</div>`;
  else body=`<section class="card"><div class="field"><label for="nm1">Таны нэр</label><input id="nm1" maxlength="16" value="${esc(n)}" placeholder="Тоглогч 1" autocomplete="off"></div></section>
    <button class="btn" data-act="create-room">Өрөө үүсгэх</button>
    <div class="or">эсвэл кодоор нэгдэх</div>
    <section class="card"><div class="field"><label for="code">Өрөөний код</label><input id="code" class="code-in" maxlength="4" value="${esc(UI.joinCode)}" placeholder="ABCD" autocomplete="off" autocapitalize="characters"></div>
      <button class="btn ghost" data-act="join-room">Нэгдэх</button></section>`;
  $('#app').innerHTML=`<main class="wrap">${topBar('Онлайн')}${body}</main>`;
}
async function netOpen(role,code){
  const name=cleanName(($('#nm1')||{}).value)||'Тоглогч 1';DB.last.p1=name;saveDB();
  Object.assign(NET,{role,code,name,team:role==='host'?0:1,opp:null,oppSeen:0,gr:false,ready:false,conn:false,lastSt:0,lastHi:0,pending:null,full:false,gotSt:0,openedAt:Date.now(),noHostShown:false,oppOn:false});
  G=null;
  try{NET.tr=NET.kind==='room'?await roomTransport(code,netMsg,netStatus):wsTransport(code,netMsg,netStatus);}
  catch(e){NET.tr=null;toast('Өрөөнд холбогдож чадсангүй');return;}
  go('lobby');
}
function netStatus(c){const was=NET.conn;NET.conn=c;if(c&&!was){NET.lastHi=0;NET.lastSt=0;}refreshNet();}
function netLeave(){if(NET.tr)NET.tr.close();NET.tr=null;NET.role=null;G=null;go('home');}
function oppStatus(){
  if(!NET.tr)return '';if(!NET.conn)return '<span style="color:var(--loss)">· холболт тасарсан</span>';if(!NET.opp)return '';
  return Date.now()-NET.oppSeen<8000?'<span style="color:var(--money)">· ● онлайн</span>':'<span style="color:var(--loss)">· ● саатсан</span>';
}
const SYNC=['gid','first','deck','ptr','cur','cardNo','money','rost','gives','skips','phase','kind','actor','bid','hi','log','seq','res','sold','autoTo'];
function hostSnapshot(){
  let g=null;if(G){g={};SYNC.forEach(k=>g[k]=G[k]);g.rem=Math.max(0,G.deadline-Date.now());g.sa=Math.max(0,Date.now()-G.startedAt);}
  return {t:'st',v:1,pid:PID,code:NET.code,hn:NET.name,gn:NET.opp?NET.opp.name:'',gp:NET.opp?NET.opp.pid:'',gr:NET.gr,g};
}
function hostBroadcast(){if(NET.tr){NET.tr.send(hostSnapshot());NET.lastSt=Date.now();}}
function netMsg(d){
  if(!d||typeof d!=='object'||d.pid===PID)return;
  const now=Date.now();
  if(NET.role==='host'){
    if(NET.opp&&d.pid===NET.opp.pid)NET.oppSeen=now;
    if(d.t==='hi'&&d.role==='guest'){
      const free=!NET.opp||d.pid===NET.opp.pid||(now-NET.oppSeen>15000&&(!G||G.phase==='match'));
      if(!free)return;
      const fresh=!NET.opp||NET.opp.pid!==d.pid,nm=cleanName(d.name)||'Зочин',renamed=NET.opp&&NET.opp.name!==nm;
      NET.opp={pid:d.pid,name:nm};NET.oppSeen=now;if(fresh)NET.gr=false;
      if(fresh||renamed){if(G&&!fresh)G.names[1]=nm;hostBroadcast();refreshNet();}
    }else if(d.t==='ready'&&NET.opp&&d.pid===NET.opp.pid){
      if(NET.gr!==!!d.ready){NET.gr=!!d.ready;refreshNet();}hostBroadcast();
    }else if(d.t==='act'&&NET.opp&&d.pid===NET.opp.pid&&G&&d.gid===G.gid&&d.seq===G.seq&&G.actor===1){
      if(act(G,1,d.a,d.v))afterChange();else hostBroadcast();
    }
  }else if(NET.role==='guest'&&d.t==='st'&&d.code===NET.code)guestState(d);
}
function guestState(S){
  const now=Date.now();NET.gotSt=now;NET.oppSeen=now;
  const wasFull=NET.full;NET.full=!!(S.gp&&S.gp!==PID);
  if(NET.full){if(!wasFull)render();return;}
  const oppChanged=!NET.opp||NET.opp.name!==S.hn;
  NET.opp={pid:S.pid,name:cleanName(S.hn)||'Хост'};
  const grChanged=NET.gr!==!!S.gr;NET.gr=!!S.gr;
  const g=S.g;
  if(!g||(g.phase==='match'&&(!G||G.gid!==g.gid))){
    if(SCREEN!=='lobby'&&SCREEN!=='match'){G=null;go('lobby');}
    else if(SCREEN==='lobby'&&(oppChanged||grChanged||wasFull))render();
    else refreshNet();
    return;
  }
  const fresh=!G||G.gid!==g.gid,moved=fresh||G.seq!==g.seq;
  if(fresh){G={mode:'online',diff:'mid'};NET.ready=false;NET.pending=null;UI.lastCard=null;}
  SYNC.forEach(k=>G[k]=g[k]);
  G.names=[NET.opp.name,NET.name];G.deadline=now+(+g.rem||0);G.startedAt=now-(+g.sa||0);
  if(NET.pending&&(NET.pending.gid!==G.gid||NET.pending.seq!==G.seq))NET.pending=null;
  if(G.phase==='match'&&G.res){if(moved||SCREEN!=='match'){settle();go('match');}else refreshNet();}
  else if(moved||SCREEN!=='draft')go('draft');
  else{refreshNet();if(oppChanged)renderDraft();}
}
function sendHi(){if(NET.tr){NET.tr.send({t:'hi',role:NET.role,pid:PID,name:NET.name,code:NET.code});NET.lastHi=Date.now();}}
function sendReady(){if(NET.tr){NET.tr.send({t:'ready',pid:PID,ready:NET.ready,code:NET.code});NET.lastReady=Date.now();}}
function netTick(){
  if(!NET.tr)return;const now=Date.now();
  if(NET.role==='host'){if(now-NET.lastSt>2000)hostBroadcast();}
  else{
    if(now-NET.lastHi>3000)sendHi();
    if(NET.pending&&now-NET.pending.at>1200){const p=NET.pending;NET.tr.send({t:'act',pid:PID,gid:p.gid,seq:p.seq,a:p.a,v:p.v,code:NET.code});p.at=now;}
    if(NET.ready!==NET.gr&&now-NET.lastReady>1500)sendReady();
  }
  const on=!!(NET.oppSeen&&now-NET.oppSeen<8000);if(on!==NET.oppOn){NET.oppOn=on;refreshNet();}
}
function refreshNet(){
  if(SCREEN==='lobby'){render();return;}
  const os=$('#oppstat');if(os)os.innerHTML=oppStatus();
  if(SCREEN==='match')refreshAfter();
}
function renderLobby(){
  const host=NET.role==='host',opp=NET.opp,oppOn=opp&&Date.now()-NET.oppSeen<8000;
  const hostName=host?NET.name:(opp?opp.name:'…'),guestName=host?(opp?opp.name:''):NET.name;
  const noHost=!host&&!NET.gotSt&&Date.now()-NET.openedAt>6000;
  const link=NET.kind==='ws'?location.origin+location.pathname+'#room-'+NET.code:'';
  let main;
  if(NET.full)main=`<div class="notice">Энэ өрөөнд өөр хүн аль хэдийн нэгдсэн байна. Өөр код ашиглана уу.</div>`;
  else if(noHost)main=`<div class="notice">${esc(NET.code)} кодтой өрөө олдсонгүй. Кодоо шалгаад дахин оролдоно уу.</div>`;
  else{
    const gReady=host?NET.gr:NET.ready;
    const seatB=guestName?`<b>${esc(guestName)}</b>${gReady?'<span class="ok">Бэлэн</span>':'<span class="wait">Бэлэн биш</span>'}`:'<b class="muted">Хүлээж байна…</b><span class="wait">Кодоо найздаа илгээ</span>';
    const btn=host?`<button class="btn" data-act="host-start" ${opp&&NET.gr?'':'disabled'}>Эхлүүлэх</button><p class="stat">${!opp?'Найз тань нэгдэхийг хүлээж байна…':NET.gr?'Бүгд бэлэн. Эхлүүлээрэй!':'Зочин «Бэлэн» дарахыг хүлээж байна…'}</p>`
      :`<button class="btn ${NET.ready?'ghost':''}" data-act="ready">${NET.ready?'Бэлэн биш болох':'Бэлэн'}</button><p class="stat">${NET.ready?'Хост эхлүүлэхийг хүлээж байна…':'Бэлэн болмогц хост тоглолтыг эхлүүлнэ'}</p>`;
    main=`<div class="lseats"><div class="lseat"><span class="lbl">Хост · T</span><b>${esc(hostName)}</b><span class="wait">${host?'Та':(oppOn?'● онлайн':'')}</span></div>
      <div class="lseat b"><span class="lbl">Зочин · CT</span>${seatB}</div></div>${btn}`;
  }
  $('#app').innerHTML=`<main class="wrap">${topBar('Онлайн өрөө','leave')}
    <div class="codebox"><span class="lbl">Өрөөний код</span><span class="led num">${esc(NET.code)}</span>
      ${host?`<span class="muted" style="font-size:13px;text-align:center">Найз тань «Онлайн → Нэгдэх» хэсэгт энэ кодыг оруулна</span>`:''}
      ${host&&link?`<button class="btn ghost" data-act="copy" style="min-height:40px;padding:8px 14px">Холбоос хуулах</button>`:''}</div>
    ${main}<p class="net ${NET.conn?'':'bad'}">${NET.conn?'Сервертэй холбогдсон':'Сервертэй холбогдож байна…'}</p></main>`;
}
function hostStart(){
  if(NET.role!=='host'||!NET.opp||!NET.gr)return;
  G=newGame('online',[NET.name,NET.opp.name]);NET.gr=false;UI.lastCard=null;
  hostBroadcast();go('draft');
}

/* ================= modals ================= */
function modal(html){$('#modal').innerHTML=`<div class="modal" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const b=$('#modal .sheet button');if(b)b.focus();}
function closeModal(){$('#modal').innerHTML='';}

  </ol>
  <p class="fine">Тамирчид: HLTV-ийн 2026.11.09-ний дэлхийн Top 20 баг, мөн BC.Game, 100 Thieves, TYLOO, Chinggis Warriors. Rating нь HLTV-ийн багийн хуудсан дээрх, тухайн багт тоглосон хугацааных (2026 оны 11-р сар).</p>
  <button class="btn" data-act="close">Ойлголоо</button>`);
}
function quitModal(){modal(`<h2>Тоглоомоос гарах уу?</h2><p class="muted">Энэ draft дуусахгүй, ялалт ялагдал бүртгэгдэхгүй.</p>
  <div class="row2"><button class="btn ghost" data-act="close">Үргэлжлүүлэх</button><button class="btn" data-act="quit-yes">Гарах</button></div>`);}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close-bg'){if(e.target===b)closeModal();return;}
  switch(a){
    case 'nav':go(b.dataset.to);break;
    case 'home':G=null;go('home');break;
    case 'rules':rulesModal();break;
    case 'close':closeModal();break;
    case 'diff':UI.diff=b.dataset.d;document.querySelectorAll('[data-act="diff"]').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'start-cpu':startCpu();break;
    case 'start-local':startLocal();break;
    case 'do':humanAct(b.dataset.a);break;
    case 'raise':humanAct('raise',+b.dataset.v);break;
    case 'quit':quitModal();break;
    case 'quit-yes':closeModal();if(G&&G.mode==='online')netLeave();else{G=null;go('home');}break;
    case 'skip':if(ANIM&&ANIM.skip)ANIM.skip();break;
    case 'again':again();break;
    case 'create-room':netOpen('host',rid(4,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'));break;
    case 'join-room':{const c=(($('#code')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(c.length!==4){toast('4 тэмдэгттэй код оруулна уу');return;}UI.joinCode=c;netOpen('guest',c);break;}
    case 'ready':NET.ready=!NET.ready;sendReady();if(SCREEN==='lobby')render();else refreshAfter();break;
    case 'host-start':hostStart();break;
    case 'leave':if(G&&G.phase!=='match')quitModal();else netLeave();break;
    case 'copy':{const link=location.origin+location.pathname+'#room-'+NET.code;
      (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Холбоос хуулагдлаа'),()=>toast(link));break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ================= loop & boot ================= */
setInterval(()=>{
  if(SCREEN==='draft'&&G&&G.phase!=='match'){
    updateTimer();
    if(isAuthority()&&stepClock(G))afterChange();
  }
  netTick();
  if(SCREEN==='lobby'&&NET.role==='guest'&&!NET.gotSt&&Date.now()-NET.openedAt>6000&&!NET.noHostShown){NET.noHostShown=true;render();}
},200);
(function boot(){
  const m=location.hash.match(/^#room-([A-Za-z0-9]{4})$/);
  if(m){UI.joinCode=m[1].toUpperCase();go('online');}else go('home');
  setTimeout(()=>{detectTransport();},0);
})();
</script>
